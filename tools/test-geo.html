<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eagle Eye — geo.js tests</title>
<style>
  body { background:#0B0910; color:#F4F0E8; font:13px ui-monospace,Menlo,monospace; padding:20px; }
  h1 { font-size:16px; color:#D4AF37; }
  .ok { color:#6ED29A; } .bad { color:#E0897D; }
  #sum { font-size:15px; margin:14px 0; padding:10px; border:1px solid rgba(212,175,55,.4); }
  div.t { padding:2px 0; }
</style>
</head>
<body>
<h1>Eagle Eye — geo.js</h1>
<div id="sum"></div>
<div id="out"></div>
<script src="../geo.js"></script>
<script>
var pass = 0, fail = 0, lines = [];
function ok(name, cond, extra) {
  if (cond) { pass++; lines.push('<div class="t ok">PASS  ' + name + '</div>'); }
  else { fail++; lines.push('<div class="t bad">FAIL  ' + name + (extra ? '  — ' + extra : '') + '</div>'); }
}
function near(name, a, b, tol) {
  var d = Math.abs(a - b);
  ok(name, d <= tol, 'got ' + a + ' want ' + b + ' (d=' + d.toExponential(2) + ')');
}

/* ---- linear solve ---- */
(function () {
  var x = EE.solveLinear([[2, 1], [1, 3]], [5, 10]);
  near('solveLinear x', x[0], 1, 1e-9);
  near('solveLinear y', x[1], 3, 1e-9);
  ok('solveLinear singular -> null', EE.solveLinear([[1, 2], [2, 4]], [1, 2]) === null);
})();

/* ---- rotation matrix ---- */
(function () {
  var R = EE.rotFromOrientation(0, 90, 0);
  var camAxis = EE.applyM3(R, [0, 0, -1]);       /* rear camera looks down device -Z */
  near('upright phone: camera points north (y)', camAxis[1], 1, 1e-9);
  near('upright phone: camera level (z)', camAxis[2], 0, 1e-9);
  var up = EE.applyM3(R, [0, 1, 0]);
  near('upright phone: screen-top is world up', up[2], 1, 1e-9);

  /* orthonormal for an arbitrary attitude */
  var Q = EE.rotFromOrientation(37, 62, -18);
  var I = EE.mul3(Q, EE.transpose3(Q));
  var err = 0;
  [1, 0, 0, 0, 1, 0, 0, 0, 1].forEach(function (v, i) { err = Math.max(err, Math.abs(I[i] - v)); });
  near('rotation is orthonormal', err, 0, 1e-12);

  var Rflat = EE.rotFromOrientation(0, 0, 0);
  var down = EE.applyM3(Rflat, [0, 0, -1]);
  near('flat phone: camera points straight down', down[2], -1, 1e-9);
})();

/* ---- attitude quaternions ---- */
(function () {
  /* The quaternion path must reproduce the Euler matrix exactly, or frame
     attitudes and shutter attitudes would disagree. */
  var worst = 0;
  [[0,90,0],[37,62,-18],[180,10,80],[-140,-75,44],[359,89,-89],[0,0,0]].forEach(function (e) {
    var A = EE.rotFromOrientation(e[0], e[1], e[2]);
    var B = EE.quatToMatrix(EE.quatFromOrientation(e[0], e[1], e[2]));
    for (var i = 0; i < 9; i++) worst = Math.max(worst, Math.abs(A[i] - B[i]));
  });
  near('quaternion attitude matches the Euler matrix', worst, 0, 1e-12);

  /* Slerp endpoints and midpoint. */
  var qa = EE.quatFromOrientation(0, 60, 0), qb = EE.quatFromOrientation(40, 60, 0);
  near('slerp at t=0 is the first sample', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0), qa), 0, 1e-9);
  near('slerp at t=1 is the second sample', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 1), qb), 0, 1e-9);
  near('slerp midpoint is equidistant',
       EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qa) - EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qb), 0, 1e-9);
  near('slerp midpoint of a 40 deg pan is 20 deg', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qa), 20, 1e-9);

  /* The wraparound that naive Euler interpolation gets catastrophically wrong:
     halfway between alpha 359 and alpha 1 must be alpha 0, not alpha 180. */
  var w1 = EE.quatFromOrientation(359, 60, 0), w2 = EE.quatFromOrientation(1, 60, 0);
  var mid = EE.quatSlerp(w1, w2, 0.5);
  near('slerp crosses the alpha wrap correctly',
       EE.quatAngleDeg(mid, EE.quatFromOrientation(0, 60, 0)), 0, 1e-9);
  ok('naive Euler averaging would have pointed the camera backwards',
     Math.abs((359 + 1) / 2 - 180) < 1e-9);

  /* Antipodal representations are the same rotation and must not spin the long way. */
  var q = EE.quatFromOrientation(20, 55, 3);
  var negq = [-q[0], -q[1], -q[2], -q[3]];
  near('antipodal quaternions are the same attitude', EE.quatAngleDeg(q, negq), 0, 1e-6);
  near('slerp between antipodes does not travel', EE.quatAngleDeg(EE.quatSlerp(q, negq, 0.5), q), 0, 1e-6);

  near('quatAngleDeg of a known 30 deg pan',
       EE.quatAngleDeg(EE.quatFromOrientation(0, 90, 0), EE.quatFromOrientation(30, 90, 0)), 30, 1e-9);
})();

/* ---- ray cast: closed-form check ---- */
(function () {
  /* alpha 0, beta 60 -> camera depressed 30 deg below horizon, facing north. */
  var R = EE.rotFromOrientation(0, 60, 0);
  var g = EE.groundPoint([0, 0, -1], R, 1.6, 0);
  near('groundPoint range matches 1.6/tan30', g.y, 1.6 / Math.tan(30 * Math.PI / 180), 1e-9);
  near('groundPoint has no east offset', g.x, 0, 1e-12);
  ok('ray above horizon -> null', EE.groundPoint([0, 0, -1], EE.rotFromOrientation(0, 100, 0), 1.6, 0) === null);
})();

/* ---- pixel <-> ground round trip, portrait and landscape ---- */
[0, 90, 180, 270].forEach(function (ang) {
  var W = 1440, H = 1920, f = EE.focalFromFov(69, Math.max(W, H));
  var R = EE.rotFromOrientation(23, 58, -7), camH = 1.55;
  var worst = 0, tested = 0;
  for (var px = 200; px <= W - 200; px += 400) {
    for (var py = 200; py <= H - 200; py += 400) {
      var ray = EE.rayForPixel(px, py, W, H, f, ang);
      var gp = EE.groundPoint(ray, R, camH, 0);
      if (!gp) continue;
      var back = EE.projectToPixel(gp, R, camH, W, H, f, ang, 0);
      if (!back) { worst = Infinity; continue; }
      worst = Math.max(worst, Math.hypot(back.x - px, back.y - py));
      tested++;
    }
  }
  ok('pixel round trip @' + ang + ' deg covered pixels', tested >= 4, 'tested=' + tested);
  near('pixel round trip @' + ang + ' deg max error px', worst, 0, 1e-6);
});

/* ---- homography agrees with the ray model ----
   Synthesise a camera, project four known ground corners into pixels, solve the
   homography from those alone, then check it reproduces the ray model elsewhere.
   This cross-validates the two independent engines against each other. */
(function () {
  var W = 1440, H = 1920, f = EE.focalFromFov(69, H);
  var R = EE.rotFromOrientation(15, 55, 4), camH = 1.6;

  var refGround = EE.rectRefCorners(2.4, 1.2).map(function (p) { return { x: p.x + 1, y: p.y + 4 }; });
  var refPix = refGround.map(function (p) { return EE.projectToPixel(p, R, camH, W, H, f, 0, 0); });
  ok('reference corners all in front of camera', refPix.every(Boolean));

  var Href = EE.rectRefCorners(2.4, 1.2);
  var Hm = EE.homographyFromQuad(refPix, Href);
  ok('homography solved', !!Hm);

  /* Any other pixel: homography result should match the ray model, offset by the
     same (1,4) shift that separates the two coordinate frames. */
  var worst = 0;
  for (var px = 300; px < W - 300; px += 300) {
    for (var py = 900; py < H - 200; py += 300) {
      var g = EE.groundPoint(EE.rayForPixel(px, py, W, H, f, 0), R, camH, 0);
      if (!g) continue;
      var hp = EE.applyH(Hm, { x: px, y: py });
      if (!hp) { worst = Infinity; continue; }
      worst = Math.max(worst, Math.hypot(hp.x - (g.x - 1), hp.y - (g.y - 4)));
    }
  }
  near('homography vs ray model, max disagreement (m)', worst, 0, 1e-6);

  ok('applyH above horizon -> null or far', (function () {
    var p = EE.applyH(Hm, { x: 720, y: 5 });
    return p === null || Math.abs(p.y) > 100;
  })());
})();

/* ---- focal length recovered from a homography ---- */
(function () {
  var W = 1080, H = 1440;

  /* Synthesise a camera at a KNOWN focal length, project a rectangle, solve the
     homography from those four corners alone, and see if f comes back. */
  [58, 68, 77, 90].forEach(function (fovDeg) {
    var f = EE.focalFromFov(fovDeg, Math.max(W, H));
    var R = EE.rotFromOrientation(11, 57, -5), camH = 1.55;
    var ref = EE.rectRefCorners(2.4, 1.2);
    var pix = ref.map(function (p) {
      return EE.projectToPixel({ x: p.x + 1, y: p.y + 4 }, R, camH, W, H, f, 0, 0);
    });
    var Hm = EE.homographyFromQuad(pix, ref);
    var got = EE.focalFromHomography(Hm, W, H);
    ok('focal recovered at ' + fovDeg + ' deg fov', got && Math.abs(got.f - f) / f < 1e-6,
       got && (got.f.toFixed(1) + ' vs ' + f.toFixed(1)));
    ok('  and both estimates agree at ' + fovDeg, got.disagree < 1e-6, got && got.disagree);
    near('  round trips back to the fov', EE.fovFromFocalLong(got.f, Math.max(W, H)), fovDeg, 1e-6);
  });

  /* The regression this exists for: assuming 68 deg when the lens is 77 deg puts
     the horizon badly wrong, and the recovered value says so. */
  var fTrue = EE.focalFromFov(77, Math.max(W, H));
  var fAssumed = EE.focalFromFov(68, Math.max(W, H));
  var R2 = EE.rotFromOrientation(0, 58, 0);
  var hTrue = EE.homographyFromPose(R2, 1.55, fTrue, W, H, 0);
  var hAssumed = EE.homographyFromPose(R2, 1.55, fAssumed, W, H, 0);
  var horA = EE.horizonLine(hTrue, W, H), horB = EE.horizonLine(hAssumed, W, H);
  ok('a 9 deg fov error moves the horizon by many pixels',
     Math.abs(horA.y0 - horB.y0) > 25, Math.abs(horA.y0 - horB.y0).toFixed(0) + ' px');

  /* The everyday degeneracy, and the one that produced a confident wrong answer:
     no roll and no yaw relative to the reference, so one constraint's denominator
     collapses to floating-point noise. It must fall back to the constraint that
     still works rather than average in garbage. */
  (function () {
    var fx = EE.focalFromFov(77, Math.max(W, H));
    var Rlevel = EE.rotFromOrientation(0, 58, 0);       /* alpha 0, gamma 0 */
    var ref = EE.rectRefCorners(2.4, 1.2);
    var pix = ref.map(function (p) {
      return EE.projectToPixel({ x: p.x - 1.2, y: p.y + 2.0 }, Rlevel, 1.55, W, H, fx, 0, 0);
    });
    var got = EE.focalFromHomography(EE.homographyFromQuad(pix, ref), W, H);
    ok('an unrolled, unyawed shot still recovers the lens',
       got && Math.abs(got.f - fx) / fx < 1e-6, got && (got.f.toFixed(1) + ' vs ' + fx.toFixed(1)));
    ok('and it does so from one constraint, not a bogus average',
       got && got.fOrtho === null && got.fEqual != null,
       got && ('ortho=' + got.fOrtho + ' equal=' + (got.fEqual && got.fEqual.toFixed(1))));
    ok('so it reports no self-check rather than a false one', got && got.disagree === null);
  })();

  /* Straight down is the genuinely degenerate case: a fronto-parallel plane makes
     the homography a similarity, both perspective terms vanish, and there is no
     focal length to be had. It must return nothing rather than a confident guess. */
  var fx = EE.focalFromFov(68, Math.max(W, H));
  var refF = EE.rectRefCorners(2.4, 1.2);
  var nadir = refF.map(function (p) {
    return EE.projectToPixel({ x: p.x - 1.2, y: p.y - 0.6 },
      EE.rotFromOrientation(0, 0, 0), 3.0, W, H, fx, 0, 0);
  });
  var hNadir = EE.homographyFromQuad(nadir, refF);
  ok('a nadir view yields no focal length', EE.focalFromHomography(hNadir, W, H) === null,
     JSON.stringify(EE.focalFromHomography(hNadir, W, H)));

  /* But it needs very little tilt to work — 2 degrees is already enough, which
     matters because it means almost any real shot can calibrate its own lens. */
  var tilted = refF.map(function (p) {
    return EE.projectToPixel({ x: p.x - 1.2, y: p.y - 0.6 },
      EE.rotFromOrientation(0, 2, 0), 3.0, W, H, fx, 0, 0);
  });
  var got2 = EE.focalFromHomography(EE.homographyFromQuad(tilted, refF), W, H);
  ok('two degrees of tilt already recovers it', got2 && Math.abs(got2.f - fx) / fx < 1e-6,
     got2 && got2.f.toFixed(1) + ' vs ' + fx.toFixed(1));
  ok('though with only one usable constraint, so it cannot self-check',
     got2.disagree === null, got2.disagree);

  ok('a singular matrix yields nothing', EE.focalFromHomography([1,0,0, 2,0,0, 3,0,0], W, H) === null);
})();

/* ---- horizon line ---- */
(function () {
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var R = EE.rotFromOrientation(0, 58, 0);
  var Hm = EE.homographyFromPose(R, 1.55, f, W, H, 0);
  var hor = EE.horizonLine(Hm, W, H);
  ok('horizon reported', !!hor);
  near('level camera: horizon is flat across the frame', hor.y0, hor.y1, 1e-9);

  /* w must be exactly zero on the reported line, and positive below it. */
  var wAt = function (x, y) { return Hm[6]*x + Hm[7]*y + Hm[8]; };
  near('w is zero on the horizon', wAt(0, hor.y0), 0, 1e-12);
  ok('w is positive below it', wAt(W/2, hor.y0 + 50) > 0);
  ok('w is negative above it', wAt(W/2, hor.y0 - 50) < 0);

  /* Rolling the phone must tilt the horizon in the image. */
  var rolled = EE.homographyFromPose(EE.rotFromOrientation(0, 58, 20), 1.55, f, W, H, 0);
  var hr = EE.horizonLine(rolled, W, H);
  ok('a rolled phone tilts the horizon', Math.abs(hr.y0 - hr.y1) > 100,
     Math.abs(hr.y0 - hr.y1).toFixed(0) + ' px across the frame');

  /* A wrongly-rotated frame turns the horizon vertical. The y = f(x) form alone
     returned nothing here, which hid the very failure this is meant to expose. */
  var sideways = EE.homographyFromPose(R, 1.55, f, W, H, 90);
  var hs = EE.horizonLine(sideways, W, H);
  ok('a 90 deg frame rotation gives a vertical horizon', hs && hs.steep, JSON.stringify(hs));
  ok('and it is still a drawable segment',
     hs && isFinite(hs.x0) && isFinite(hs.x1) && isFinite(hs.y0) && isFinite(hs.y1));
  near('running the full height of the frame', Math.abs(hs.y1 - hs.y0), H, 1e-9);

  /* w must still flip sign across it, whichever way it runs. */
  var wS = function (x, y) { return sideways[6]*x + sideways[7]*y + sideways[8]; };
  var mx = (hs.x0 + hs.x1) / 2, my = (hs.y0 + hs.y1) / 2;
  ok('sign flips across a vertical horizon too', wS(mx - 60, my) * wS(mx + 60, my) < 0);
})();

/* ---- the deck plane from gravity ---- */
(function () {
  var D = Math.PI / 180;

  /* A phone lying face-up on a level deck reports the normal as world up. */
  var flat = EE.normalFromAttitude(0, 0, 0, false);
  near('level deck normal is world up', flat[2], 1, 1e-12);
  near('deck tilt of a level deck is zero', EE.deckTiltDeg(flat), 0, 1e-12);

  /* Face down, the device +Z points into the deck, so the sign must flip. */
  var down = EE.normalFromAttitude(0, 180, 0, true);
  near('face-down on a level deck still yields up', down[2], 1, 1e-9);

  /* A 2% drainage fall is 1.15 deg, which the reading must actually show. */
  var slope = EE.normalFromAttitude(0, 1.1458, 0, false);
  near('a 2% fall reads as 1.15 deg', EE.deckTiltDeg(slope), 1.1458, 1e-4);

  var b = EE.deckBasis(flat);
  near('level basis e1 is world east', b.e1[0], 1, 1e-12);
  near('level basis e2 is world north', b.e2[1], 1, 1e-12);

  var bs = EE.deckBasis(slope);
  var dot = function (u, v) { return u[0]*v[0] + u[1]*v[1] + u[2]*v[2]; };
  near('tilted basis stays orthonormal (e1.e2)', dot(bs.e1, bs.e2), 0, 1e-12);
  near('tilted basis lies in the deck (e1.n)', dot(bs.e1, slope), 0, 1e-12);
  near('tilted basis lies in the deck (e2.n)', dot(bs.e2, slope), 0, 1e-12);
  near('tilted basis e1 is unit', Math.hypot(bs.e1[0],bs.e1[1],bs.e1[2]), 1, 1e-12);

  /* Passing a level normal explicitly must change nothing anywhere. */
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W,H));
  var R = EE.rotFromOrientation(17, 57, -4), camH = 1.55;
  var worst = 0;
  for (var px = 120; px < W; px += 260) {
    for (var py = 700; py < H; py += 260) {
      var a1 = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0);
      var a2 = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0, [0,0,1]);
      if (!a1 || !a2) continue;
      worst = Math.max(worst, Math.hypot(a1.x-a2.x, a1.y-a2.y));
    }
  }
  near('an explicit level normal is a no-op', worst, 0, 1e-12);

  var Hl = EE.homographyFromPose(R, camH, f, W, H, 0);
  var Hn = EE.homographyFromPose(R, camH, f, W, H, 0, [0,0,1]);
  var hw = 0; for (var i=0;i<9;i++) hw = Math.max(hw, Math.abs(Hl[i]-Hn[i]));
  near('and the pose homography is unchanged', hw, 0, 1e-12);

  /* On a TILTED deck the whole chain must stay self-consistent. */
  var n = EE.normalFromAttitude(0, 2.5, 1.5, false);
  var Ht = EE.homographyFromPose(R, camH, f, W, H, 0, n);
  var worstT = 0, cases = 0;
  for (px = 120; px < W; px += 200) {
    for (py = 760; py < H; py += 200) {
      var g = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0, n);
      if (!g) continue;
      var viaH = EE.applyH(Ht, {x:px, y:py});
      if (!viaH) { worstT = Infinity; continue; }
      worstT = Math.max(worstT, Math.hypot(viaH.x-g.x, viaH.y-g.y));
      var back = EE.projectToPixel(g, R, camH, W, H, f, 0, 0, n);
      worstT = Math.max(worstT, Math.hypot(back.x-px, back.y-py) * 1e-6);
      cases++;
    }
  }
  ok('tilted-deck cases covered', cases > 8, cases);
  near('pose homography, ray cast and reprojection all agree on a tilted deck', worstT, 0, 1e-8);

  /* Height still comes back right when the deck is not level. */
  var base = {x: 1.2, y: 7.0}, objH = 1.35;
  var bp = EE.projectToPixel(base, R, camH, W, H, f, 0, 0, n);
  var tp = EE.projectToPixel(base, R, camH, W, H, f, 0, objH, n);
  var gb = EE.groundPoint(EE.rayForPixel(bp.x,bp.y,W,H,f,0), R, camH, 0, n);
  var hm = EE.heightFromBaseTop(gb, EE.rayForPixel(tp.x,tp.y,W,H,f,0), R, camH, n);
  near('height on a tilted deck recovers 1.35 m', hm, objH, 1e-8);

  /* Ignoring a real slope costs range error, which is the point of measuring it. */
  var gTilt = EE.groundPoint(EE.rayForPixel(W/2, H*0.72, W,H,f,0), R, camH, 0, n);
  var gFlat = EE.groundPoint(EE.rayForPixel(W/2, H*0.72, W,H,f,0), R, camH, 0);
  ok('a 3 deg slope moves a mid-field point measurably',
     Math.hypot(gTilt.x-gFlat.x, gTilt.y-gFlat.y) > 0.05,
     Math.hypot(gTilt.x-gFlat.x, gTilt.y-gFlat.y).toFixed(3) + ' m');

  /* Scale-from-known-length must work on a tilted deck too. */
  var pa = EE.projectToPixel({x:-1.5,y:6}, R, 1.72, W,H,f,0,0,n);
  var pb = EE.projectToPixel({x: 1.5,y:6}, R, 1.72, W,H,f,0,0,n);
  var solved = EE.camHeightFromKnown(
      EE.rayForPixel(pa.x,pa.y,W,H,f,0), EE.rayForPixel(pb.x,pb.y,W,H,f,0), R, 3.0, n);
  near('camera height solves on a tilted deck', solved, 1.72, 1e-9);
})();

/* ---- corner snapping ---- */
(function () {
  /* A synthetic dark quadrant on a light field: the corner is at (cx, cy). */
  var mk = function (w, h, cx, cy, noise) {
    var g = new Float32Array(w * h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var v = (x < cx && y < cy) ? 40 : 200;
      if (noise) v += ((x * 7919 + y * 104729) % 17 - 8) * noise;
      g[y * w + x] = v;
    }
    return g;
  };

  var N = 41;
  var c = EE.bestCorner(mk(N, N, 20, 20, 0), N, N, 8);
  ok('finds a corner at the patch centre', c && Math.hypot(c.x - 19.5, c.y - 19.5) <= 1.5,
     c && (c.x + ',' + c.y));
  ok('and reports it as far above the local texture', c.ratio > 20, c.ratio.toFixed(1));

  /* Offset corner: it must snap TO the corner, not stay at the tap. */
  var off = EE.bestCorner(mk(N, N, 26, 15, 0), N, N, 8);
  ok('snaps to an off-centre corner', Math.hypot(off.x - 25.5, off.y - 14.5) <= 1.5,
     off.x + ',' + off.y);
  ok('and reports how far it moved', off.dist > 4, off.dist.toFixed(1));

  /* A straight EDGE is not a corner — Shi-Tomasi must not reward it. */
  var edge = new Float32Array(N * N);
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) edge[y * N + x] = x < 20 ? 40 : 200;
  var e = EE.bestCorner(edge, N, N, 8);
  ok('an edge scores far lower than a corner', e.lambda < c.lambda / 50,
     e.lambda.toFixed(1) + ' vs ' + c.lambda.toFixed(1));

  /* Blank membrane must not manufacture a corner from noise. */
  var blank = new Float32Array(N * N);
  for (var i = 0; i < blank.length; i++) blank[i] = 128 + ((i * 7919) % 5 - 2) * 0.4;
  var bl = EE.bestCorner(blank, N, N, 8);
  ok('a featureless patch yields a weak response', bl.lambda < c.lambda / 200,
     bl.lambda.toFixed(2));

  /* The distance prior must stop it wandering to a better corner far away. */
  var two = mk(N, N, 21, 21, 0);

         makes a correct refiner look biased. */

    var err = Math.hypot(r.x - c[0], r.y - c[1]);

     whole.toFixed(3) + ' px -> ' + Math.hypot(refined.x-target[0], refined.y-target[1]).toFixed(3) + ' px');

/* ---- ball rim refinement ---- */
(function () {

      var d = Math.sqrt(((x - cx) / rx) * ((x - cx) / rx) + ((y - cy) / ry) * ((y - cy) / ry));
      var v = 110 + 120 * cl(((1 - d) * Math.min(rx, ry)) / 1.2 + 0.5);

  near('radius to a third of a pixel', f1.r, 24.3, 0.35);
  near('horizontal diameter to half a pixel', f1.dh, 48.6, 0.5);
  ok('and says the horizontal probe succeeded', f1.horizRefined === true);
  ok('with a tight fit', f1.rms < 0.6, f1.rms);

     dimples add strong gradients inside the ball. It shipped a "lock" that only

  near('width within 1.5 px on a 2.6 px-soft rim', ff.dh, 48.6, 1.5);

/* ---- position error: the only honest confidence metric ---- */
(function () {
  var camH = 1.55, d = 10;

  /* Validate the closed form against the real projection rather than against any
     asserted figure: aim the camera axis at a point 10 m out, nudge the tilt, and
     measure how far the intersection actually travels. */
  var depression = Math.atan(camH / d);
  var beta = 90 - depression * 180 / Math.PI;
  var yAt = function (b) {
    return EE.groundPoint([0, 0, -1], EE.rotFromOrientation(0, b, 0), camH, 0).y;
  };
  near('camera axis lands where intended', yAt(beta), d, 1e-9);

  var eps = 1e-4;                                    /* degrees */
  var measured = Math.abs(yAt(beta + eps) - yAt(beta - eps)) / (2 * eps * Math.PI / 180);
  near('bearingSensitivity matches the real projection (m per rad)',
       EE.bearingSensitivity(camH, d), measured, 1e-3);
  near('and it is (h^2 + d^2)/h', EE.bearingSensitivity(camH, d), (camH*camH + d*d)/camH, 1e-12);

  var half = 0.5 * Math.PI / 180;
  var sig = EE.positionSigma(camH, d, half, 0);
  near('half a degree at 10 m moves the point 58 cm', sig, 0.5766, 5e-4);
  ok('position error grows quadratically, not linearly',
     EE.positionSigma(camH, 20, half, 0) / sig > 3.5,
     (EE.positionSigma(camH, 20, half, 0) / sig).toFixed(2) + 'x for 2x the range');

  /* Standing closer is worth more than any amount of resolution. */
  ok('halving the range cuts the error roughly fourfold',
     EE.positionSigma(camH, 5, half, 0) < sig / 3.4,
     EE.positionSigma(camH, 5, half, 0).toFixed(3));

  /* Deck uncertainty is a separate, declared term. */
  near('deck uncertainty drags the point out by delta.d/h',
       EE.positionSigma(camH, d, 0, 0.08), 0.08 * d / camH, 1e-12);
  near('the two combine in quadrature',
       EE.positionSigma(camH, d, half, 0.08),
       Math.hypot(0.5766, 0.08 * d / camH), 5e-4);

  /* The trusted radius must invert the sigma exactly — attitude alone... */
  [0.10, 0.25, 0.50].forEach(function (tol) {
    var r = EE.maxTrustedRange(camH, half, tol);
    near('maxTrustedRange(' + tol + ' m) inverts positionSigma', EE.positionSigma(camH, r, half, 0), tol, 1e-9);
  });
  near('trusted radius at 0.25 m tolerance is 6.5 m', EE.maxTrustedRange(camH, half, 0.25), 6.481, 2e-3);

  /* ...and with the deck term too, or the ring disagrees with the colour inside
     it. This is the regression: the radius and the coverage colouring must use
     one sigma. */
  [[0.10, 0.05], [0.25, 0.08], [0.50, 0.15]].forEach(function (pair) {
    var r = EE.maxTrustedRange(camH, half, pair[0], pair[1]);
    near('maxTrustedRange inverts positionSigma with deck ' + pair[1] + ' m',
         EE.positionSigma(camH, r, half, pair[1]), pair[0], 1e-9);
  });
  ok('deck uncertainty shrinks the trusted radius',
     EE.maxTrustedRange(camH, half, 0.25, 0.08) < EE.maxTrustedRange(camH, half, 0.25),
     EE.maxTrustedRange(camH, half, 0.25, 0.08).toFixed(2) + ' m vs ' + EE.maxTrustedRange(camH, half, 0.25).toFixed(2) + ' m');
  near('deck 0 reduces to the attitude-only closed form',
       EE.maxTrustedRange(camH, half, 0.25, 0), EE.maxTrustedRange(camH, half, 0.25), 1e-12);

  ok('a degree of skew nearly halves the trusted radius',
     EE.maxTrustedRange(camH, 2 * half, 0.25) < EE.maxTrustedRange(camH, half, 0.25) * 0.72,
     EE.maxTrustedRange(camH, 2*half, 0.25).toFixed(2) + ' m vs ' + EE.maxTrustedRange(camH, half, 0.25).toFixed(2) + ' m');
  ok('an impossible tolerance yields no radius', EE.maxTrustedRange(camH, half, 0.001) === 0);
  ok('an impossible tolerance yields no radius with deck too', EE.maxTrustedRange(camH, half, 0.001, 0.08) === 0);

  /* Sharpness and position must be shown to disagree — the reason GSD was
     rejected as a confidence colour. */
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var Hm = EE.homographyFromPose(EE.rotFromOrientation(0, 58, 0), camH, f, W, H, 0);
  var far = EE.applyH(Hm, { x: W/2, y: H * 0.55 });
  var gsdFar = EE.gsdAtPixel(Hm, { x: W/2, y: H * 0.55 });
  var posFar = EE.positionSigma(camH, Math.hypot(far.x, far.y), half, 0);
  ok('a pixel can be sharp and badly located at once', posFar > gsdFar * 3,
     'gsd ' + (gsdFar*100).toFixed(1) + ' cm vs position ' + posFar.toFixed(2) + ' m at ' +
     Math.hypot(far.x, far.y).toFixed(1) + ' m');
})();

/* ---- oriented rectangle fit ---- */
(function () {
  var rot = 0.37, cx = 12, cy = -5, w = 2.0, l = 3.5;
  var c = Math.cos(rot), s = Math.sin(rot);
  var pts = [[-w / 2, -l / 2], [w / 2, -l / 2], [w / 2, l / 2], [-w / 2, l / 2]].map(function (p) {
    return { x: cx + p[0] * c - p[1] * s, y: cy + p[0] * s + p[1] * c };
  });
  var r = EE.fitOrientedRect(pts);
  near('rect fit width', r.w, w, 1e-9);
  near('rect fit length', r.l, l, 1e-9);
  near('rect fit cx', r.cx, cx, 1e-9);
  near('rect fit cy', r.cy, cy, 1e-9);
  near('rect fit rotation', r.rot, rot, 1e-9);

  /* Tap order must not change the answer. */
  var r2 = EE.fitOrientedRect([pts[2], pts[0], pts[3], pts[1]]);
  near('rect fit is tap-order independent', Math.hypot(r2.w - r.w, r2.l - r.l), 0, 1e-9);

  /* Corners must survive a fit -> corners -> fit round trip. */
  var back = EE.fitOrientedRect(EE.rectCorners(r));
  near('rectCorners round trip', Math.hypot(back.cx - cx, back.cy - cy), 0, 1e-9);

  /* Three corners of a rectangle still recover it. */
  var r3 = EE.fitOrientedRect([pts[0], pts[1], pts[2]]);
  near('rect fit from 3 corners: width', r3.w, w, 1e-9);
  near('rect fit from 3 corners: length', r3.l, l, 1e-9);
})();

/* ---- station registration ---- */
(function () {
  var th = 0.83, tx = 14.2, ty = -3.9;
  var src = [{ x: 0, y: 0 }, { x: 5, y: 1 }, { x: 2, y: 6 }, { x: -3, y: 4 }];
  var dst = src.map(function (p) {
    return { x: Math.cos(th) * p.x - Math.sin(th) * p.y + tx, y: Math.sin(th) * p.x + Math.cos(th) * p.y + ty };
  });
  var t = EE.rigid2D(src, dst);
  near('rigid2D theta', t.theta, th, 1e-9);
  near('rigid2D tx', t.tx, tx, 1e-9);
  near('rigid2D ty', t.ty, ty, 1e-9);
  near('rigid2D rms on exact data', t.rms, 0, 1e-9);
  near('rigid2D scale diagnostic is 1', t.scale, 1, 1e-9);

  /* A station whose calibration is 8% large must be reported as such. */
  var big = src.map(function (p) { return { x: p.x * 1.08, y: p.y * 1.08 }; });
  var t2 = EE.rigid2D(big, dst);
  near('rigid2D detects an 8% scale error', t2.scale, 1 / 1.08, 1e-9);

  var back = EE.applyRigid(t, src[2]);
  near('applyRigid matches', Math.hypot(back.x - dst[2].x, back.y - dst[2].y), 0, 1e-9);
  ok('rigid2D needs 2 points', EE.rigid2D([{ x: 0, y: 0 }], [{ x: 1, y: 1 }]) === null);
})();

/* ---- similarity fit (camera pose from a reference rectangle) ---- */
(function () {
  var th = -0.41, sc = 1.6, tx = -2.5, ty = 7.25;
  var src = [{ x: 0, y: 0 }, { x: 1.4, y: 0.2 }, { x: 0.9, y: 1.9 }, { x: -0.6, y: 1.1 }];
  var dst = src.map(function (p) {
    return {
      x: sc * (Math.cos(th) * p.x - Math.sin(th) * p.y) + tx,
      y: sc * (Math.sin(th) * p.x + Math.cos(th) * p.y) + ty
    };
  });
  var t = EE.similarity2D(src, dst);
  near('similarity2D scale', t.scale, sc, 1e-9);
  near('similarity2D theta', t.theta, th, 1e-9);
  near('similarity2D tx', t.tx, tx, 1e-9);
  near('similarity2D ty', t.ty, ty, 1e-9);
  near('similarity2D rms on exact data', t.rms, 0, 1e-9);

  /* The regression this function exists for: rigid2D cannot fit a scaled pair,
     and its rms says so. Holding the two apart is the whole point. */
  var rigid = EE.rigid2D(src, dst);
  ok('rigid2D refuses to absorb the 1.6x gap (large rms)', rigid.rms > 0.5, 'rms=' + rigid.rms);
  ok('similarity2D residual is nil where rigid2D fails', t.rms < 1e-9);

  var worst = 0;
  src.forEach(function (p, i) {
    var b = EE.applySimilarityInverse(t, dst[i]);
    worst = Math.max(worst, Math.hypot(b.x - p.x, b.y - p.y));
  });
  near('applySimilarityInverse round trip', worst, 0, 1e-9);
  ok('similarity2D needs 2 points', EE.similarity2D([{ x: 0, y: 0 }], [{ x: 1, y: 1 }]) === null);
})();

  near('label floats at object height + default lift', lr.alt, 1.2 + 1.0, 1e-9);

  ok('the pin icon is suppressed, leaving text and tether', /<IconStyle><scale>0<\/scale>/.test(kml));

  var ld = new DOMParser().parseFromString(lifted, 'application/xml');

/* ---- multi-ball geometry ----

   Synthetic camera 1.55 m over a deck. Ball silhouettes are generated EXACTLY:
   a pixel sees the ball iff its ray is within asin(r/dist) of the centre
   direction, and the level extremes are found by bisection — no small-angle
   shortcuts on the input side, so the solver's own approximations are what is
   being measured. */
(function () {
  var W = 1512, HH = 2016, f = 1600, r = 0.021335, D = 2 * r;
  var dot3 = function (a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; };
  var nrm3 = function (a) { return Math.hypot(a[0], a[1], a[2]); };
  var angBetween = function (a, b) {
    var c = dot3(a, b) / (nrm3(a) * nrm3(b));
    return Math.acos(Math.min(1, Math.max(-1, c))) * 180 / Math.PI;
  };

  /* Pixel of a device-frame point (screenAngle 0) — the inverse of rayForPixel. */
  var pxOfDev = function (P) {
    var d = [P[0] / nrm3(P), P[1] / nrm3(P), P[2] / nrm3(P)];
    return { x: -f * d[0] / d[2] + W / 2, y: f * d[1] / d[2] + HH / 2 };
  };

  /* Exact silhouette extremes along the row through the centre's pixel. */
  var silhouette = function (Pd) {
    var th = Math.asin(r / nrm3(Pd));
    var c = pxOfDev(Pd);
    var covered = function (x) {
      var ray = EE.rayForPixel(x, c.y, W, HH, f, 0);
      return angBetween(ray, Pd) * Math.PI / 180 <= th;
    };
    var edge = function (xin, xout) {
      for (var i = 0; i < 60; i++) {
        var m = (xin + xout) / 2;
        if (covered(m)) xin = m; else xout = m;
      }
      return (xin + xout) / 2;
    };
    return { xL: edge(c.x, c.x - 200), xR: edge(c.x, c.x + 200), cy: c.y };
  };

  /* A deck with up-normal n (world), camera h above it; ball at deck coords
     (x, y) has its centre r above the surface. */
  var ballCenterWorld = function (n, h, x, y) {
    var b = EE.deckBasis(n);
    return [x * b.e1[0] + y * b.e2[0] + (r - h) * n[0],
      x * b.e1[1] + y * b.e2[1] + (r - h) * n[1],
      x * b.e1[2] + y * b.e2[2] + (r - h) * n[2]];
  };
  var toDev = function (R, Pw) { return EE.applyM3(EE.transpose3(R), Pw); };
  var mkBallsDev = function (R, n, h, deckXY) {
    return deckXY.map(function (g) { return toDev(R, ballCenterWorld(n, h, g[0], g[1])); });
  };
  var centersFromPixels = function (ballsDev) {
    return ballsDev.map(function (P) {
      var s = silhouette(P);
      return EE.sphereCenterDev(s.xL, s.xR, s.cy, W, HH, f, 0, D);
    });
  };

  var Rtrue = EE.rotFromOrientation(12, 52, -4);
  var LEVEL = [0, 0, 1];
  var h = 1.55;
  var tiny = [1e-4, 1e-4, 1e-4];

  /* Self-ranging: a ball's centre recovered from its silhouette alone. */
  var P1 = mkBallsDev(Rtrue, LEVEL, h, [[-0.4, 2.2]])[0];
  var sc = centersFromPixels([P1])[0];
  ok('sphere centre recovered from silhouette', !!sc, 'null');
  near('…to under 2 mm', Math.hypot(sc.p[0] - P1[0], sc.p[1] - P1[1], sc.p[2] - P1[2]), 0, 0.002);
  near('…range to 0.1%', sc.dist / nrm3(P1), 1, 0.001);

  /* Two balls under an HONEST sensor: nothing to report, sensor kept. */
  var honest2 = mkBallsDev(Rtrue, LEVEL, h, [[-0.5, 2.2], [0.7, 3.0]]);
  var nPredHonest = toDev(Rtrue, LEVEL);
  var r2 = EE.ballPlane(centersFromPixels(honest2).map(function (s) { return s.p; }), nPredHonest, r, tiny);
  ok('two balls, honest sensor: tilt reads zero', Math.abs(r2.tiltAlongDeg) < 0.06, r2.tiltAlongDeg);
  ok('…and the sensor plane is kept', r2.use === 'sensor', r2.use);
  near('…height from ball 1', r2.hs[0], h, 0.004);
  near('…height from ball 2', r2.hs[1], h, 0.004);
  near('…camera height', r2.camH, h, 0.004);

  /* Two balls under a sensor LYING by 5° of pitch, balls separated in depth so
     the lie lands along their baseline. The photo out-votes the sensor. */
  var Rlie = EE.rotFromOrientation(12, 57, -4);
  var lie2 = mkBallsDev(Rtrue, LEVEL, h, [[0, 1.8], [0, 3.2]]);
  var nTrueDev = toDev(Rtrue, LEVEL);
  var nPredLie = toDev(Rlie, LEVEL);
  var l2 = EE.ballPlane(centersFromPixels(lie2).map(function (s) { return s.p; }), nPredLie, r, tiny);
  near('lying sensor: the pair reads the 5° bias', Math.abs(l2.tiltAlongDeg), 5, 0.15);
  ok('…and the photo wins', l2.use === 'photo', l2.use);
  /* A pair cannot see across its own line: the correction removes the error
     ALONG the baseline and must leave the small cross component (the balls run
     ~7° off the camera azimuth here, so ~5°·sin7° ≈ 0.9° survives). */
  ok('…corrected plane is 4-5× closer to the TRUE deck', angBetween(l2.n, nTrueDev) < 1.3 &&
     angBetween(l2.n, nTrueDev) < angBetween(nPredLie, nTrueDev) / 3.5,
     angBetween(l2.n, nTrueDev).toFixed(2) + '° vs ' + angBetween(nPredLie, nTrueDev).toFixed(2) + '° uncorrected');
  near('…camera height still true', l2.camH, h, 0.01);

  /* Three balls, honest sensor: confirmation, not correction. */
  var honest3 = mkBallsDev(Rtrue, LEVEL, h, [[-0.8, 1.9], [0.9, 2.1], [0.05, 3.1]]);
  var r3 = EE.ballPlane(centersFromPixels(honest3).map(function (s) { return s.p; }), nPredHonest, r, tiny);
  ok('three balls, honest sensor: agreement under 0.1°', r3.disagreeDeg < 0.1, r3.disagreeDeg);
  ok('…sensor kept', r3.use === 'sensor', r3.use);
  near('…camera height', r3.camH, h, 0.005);

  /* Three balls, sensor lying 6° pitch + 2° roll: the photo plane IS the deck. */
  var Rlie2 = EE.rotFromOrientation(12, 58, -2);
  var nPredLie2 = toDev(Rlie2, LEVEL);
  var l3 = EE.ballPlane(centersFromPixels(honest3).map(function (s) { return s.p; }), nPredLie2, r, tiny);
  ok('badly lying sensor: disagreement seen (~6.3°)', l3.disagreeDeg > 5.5 && l3.disagreeDeg < 7.2, l3.disagreeDeg);
  ok('…photo wins', l3.use === 'photo', l3.use);
  ok('…photo plane matches the TRUE deck to 0.1°', angBetween(l3.n, nTrueDev) < 0.1,
     angBetween(l3.n, nTrueDev).toFixed(3) + '°');
  near('…camera height from a lying sensor', l3.camH, h, 0.01);

  /* THE MONEY SHOT: a true 0.5 m square, traced through a homography built with
     the LYING attitude but the ball-measured plane stored device-frame — the
     exact route the app takes through cal.deckDev — comes out 0.5000 square. */
  var sq = [{ x: 0.6, y: 2.0 }, { x: 1.1, y: 2.0 }, { x: 1.1, y: 2.5 }, { x: 0.6, y: 2.5 }];
  var pix = sq.map(function (pt) {
    return EE.projectToPixel(pt, Rtrue, h, W, HH, f, 0, 0, LEVEL);
  });
  ok('square projects into frame', pix.every(Boolean));
  var nWorldApp = EE.applyM3(Rlie2, l3.n);
  var Happ = EE.homographyFromPose(Rlie2, l3.camH, f, W, HH, 0, nWorldApp);
  var gnd = pix.map(function (q) { return EE.applyH(Happ, q); });
  ok('…and maps back through the lying-sensor + ball-plane homography', gnd.every(Boolean));
  var side = function (i, j) { return Math.hypot(gnd[i].x - gnd[j].x, gnd[i].y - gnd[j].y); };
  near('side 1 of the square', side(0, 1), 0.5, 0.003);
  near('side 2 of the square', side(1, 2), 0.5, 0.003);
  near('side 3 of the square', side(2, 3), 0.5, 0.003);
  near('side 4 of the square', side(3, 0), 0.5, 0.003);

  /* A deck that REALLY slopes 1.5° to the drain, flip test never run: the balls
     sit on the slope, so the photo plane recovers it — sloped, as built. */
  var s15 = Math.sin(1.5 * Math.PI / 180), c15 = Math.cos(1.5 * Math.PI / 180);
  var nSlope = [0, -s15, c15];
  var slope3 = mkBallsDev(Rtrue, nSlope, h, [[-0.7, 1.9], [0.8, 2.2], [0.0, 3.0]]);
  var sl = EE.ballPlane(centersFromPixels(slope3).map(function (s) { return s.p; }), nPredHonest, r, tiny);
  near('a real 1.5° drainage slope is seen as 1.5°', sl.disagreeDeg, 1.5, 0.1);
  ok('…photo plane used', sl.use === 'photo', sl.use);
  ok('…and it matches the sloped deck to 0.1°', angBetween(sl.n, toDev(Rtrue, nSlope)) < 0.1,
     angBetween(sl.n, toDev(Rtrue, nSlope)).toFixed(3) + '°');

  /* Three balls in a line know nothing across the line: refused, not guessed. */
  var lined = mkBallsDev(Rtrue, LEVEL, h, [[-0.5, 2.0], [0, 2.5], [0.5, 3.0]]);
  var ld = EE.ballPlane(centersFromPixels(lined).map(function (s) { return s.p; }), nPredHonest, r, tiny);
  ok('collinear balls are refused', ld.degenerate === 'collinear', ld.degenerate);

  /* Noise gate: with realistic rim noise declared, a bunched pair must never
     out-vote the sensor — correcting a good sensor by ranging noise would add
     noise, and with a cluster the disagreement IS the noise. */
  var near2 = mkBallsDev(Rtrue, LEVEL, h, [[-0.15, 2.2], [0.15, 2.3]]);
  var ng = EE.ballPlane(centersFromPixels(near2).map(function (s) { return s.p; }), nPredLie, r, [0.02, 0.02]);
  ok('short baseline + honest noise: sensor kept even when it lies', ng.use === 'sensor',
     ng.use + ' σ=' + (ng.sigmaDeg && ng.sigmaDeg.toFixed(1)));
  ok('…and the diagnosis is the constellation, not agreement', ng.whyNot === 'noise', ng.whyNot);

  /* THE FIELD CASE that shipped a 55° horizon: a hand-span cluster of three,
     good triangle shape, real rim noise, and a wildly disagreeing "plane". The
     photo must never be adopted from a constellation that cannot resolve tilt,
     however large the disagreement it thinks it sees. */
  var clusterXY = [[-0.15, 2.2], [0.15, 2.2], [0, 2.5]];
  var cluster = mkBallsDev(Rtrue, LEVEL, h, clusterXY);
  var cl = EE.ballPlane(centersFromPixels(cluster).map(function (s) { return s.p; }),
    nPredLie2, r, [0.02, 0.02, 0.02]);
  ok('hand-span cluster: photo never adopted', cl.use === 'sensor', cl.use);
  ok('…flagged as incapable, with the resolution named', cl.whyNot === 'noise' && cl.sigmaDeg > 4,
     cl.whyNot + ' σ=' + (cl.sigmaDeg && cl.sigmaDeg.toFixed(1)));
  /* Heights from a cluster are as good as the plane they are measured against:
     true under an honest sensor, and honestly wrong under a lying one — a
     cluster cannot repair the plane, which is exactly why it must say so. */
  var clH = EE.ballPlane(centersFromPixels(cluster).map(function (s) { return s.p; }),
    nPredHonest, r, [0.02, 0.02, 0.02]);
  near('…heights average true once the plane is honest', clH.camH, h, 0.01);

  /* A truly tiny cluster is refused as geometry before noise even enters. */
  var tinyC = mkBallsDev(Rtrue, LEVEL, h, [[-0.08, 2.2], [0.08, 2.2], [0, 2.33]]);
  var tc = EE.ballPlane(centersFromPixels(tinyC).map(function (s) { return s.p; }), nPredHonest, r, tiny);
  ok('a hand-span triangle is degenerate outright', tc.degenerate === 'tiny', tc.degenerate);

  /* One corrupt range — a rim locked at half size ranges its ball at twice the
     distance. Every ball prices the same camera height, so the traitor is
     identified by name, at ANY spread, before any plane mathematics. */
  var goodC = centersFromPixels(honest3).map(function (s) { return s.p; });
  var corrupt = [goodC[0], goodC[1], [goodC[2][0] * 2, goodC[2][1] * 2, goodC[2][2] * 2]];
  var imp = EE.ballPlane(corrupt, nPredHonest, r, tiny);
  ok('corrupt range: the traitor ball is identified', imp.rangeSuspect === 2 && imp.use === 'sensor',
     'rangeSuspect=' + imp.rangeSuspect);
  var corrupt2 = [goodC[0], [goodC[1][0] * 1.6, goodC[1][1] * 1.6, goodC[1][2] * 1.6]];
  var imp2 = EE.ballPlane(corrupt2, nPredHonest, r, [1e-4, 1e-4]);
  ok('…a corrupt pair is flagged too, unattributed', imp2.rangeSuspect === -1, imp2.rangeSuspect);

  /* The systemic backstop: an attitude wrong by 30° — the screen-rotation
     class of failure — prices the camera at absurd, mutually inconsistent
     heights (0.33 m and −0.17 m here). That must read as "the attitude is
     broken", never as one framed ball, and never as an adoptable plane. */
  var nPred30 = toDev(EE.rotFromOrientation(12, 82, -4), LEVEL);
  var imp3 = EE.ballPlane(centersFromPixels(honest3).map(function (s) { return s.p; }), nPred30, r, tiny);
  ok('a 30° attitude error reads as systemic, not as a bad ball',
     imp3.systemic === true && imp3.rangeSuspect == null && imp3.use === 'sensor',
     'systemic=' + imp3.systemic + ' suspect=' + imp3.rangeSuspect +
     ' hs=' + imp3.hs.map(function (v) { return v.toFixed(2); }).join('/'));

  /* One ball, off the midline — the reason the single-ball solve moved onto
     sphere ranging. The old route (rim extremes as two ground points a diameter
     apart) is exact dead ahead but grows a quadratic off-axis bias; ranging has
     no such term. The ball here sits ~9° off-centre, inside the 14° the UI
     tolerates without a warning. */
  var one = mkBallsDev(Rtrue, LEVEL, h, [[0.55, 2.4]])[0];
  var so = silhouette(one);
  var b1 = EE.ballPlane([EE.sphereCenterDev(so.xL, so.xR, so.cy, W, HH, f, 0, D).p], nPredHonest, r, tiny);
  var ra = EE.rayForPixel(so.xL, so.cy, W, HH, f, 0);
  var rb = EE.rayForPixel(so.xR, so.cy, W, HH, f, 0);
  var legacy = EE.camHeightFromKnown(ra, rb, Rtrue, D, LEVEL) + r;
  near('one ball off-centre: sphere ranging stays exact', b1.camH, h, 0.003);
  ok('…where the retired tangent-chord solve drifted ≥0.5%', Math.abs(legacy / h - 1) > 0.005,
     ((legacy / h - 1) * 100).toFixed(2) + '%');
})();

/* ---- the colour axis: reading a ball luminance cannot see ---- */
(function () {
  var mk = function (rgb) { return [rgb[0], rgb[1], rgb[2]]; };
  var jig = function (rgb, k) { return [rgb[0] + (k % 5) - 2, rgb[1] + (k % 7) - 3, rgb[2] + (k % 3) - 1]; };
  var YEL = [150, 120, 20], GREY = [120, 120, 120];
  var inner = [], outer = [];
  for (var i = 0; i < 24; i++) { inner.push(jig(YEL, i)); outer.push(jig(GREY, i * 3)); }

  var ax = EE.colorAxis(inner, outer);
  ok('dark-yellow on grey yields an axis', !!ax, 'null');
  ok('…with strong separation', ax.sep > 80, ax.sep);
  var luma = function (c) { return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; };
  ok('…where luminance is nearly blind', Math.abs(luma(YEL) - luma(GREY)) < 6,
     Math.abs(luma(YEL) - luma(GREY)).toFixed(1));
  ok('grey on grey yields nothing', EE.colorAxis(
    [mk(GREY), mk(GREY), mk(GREY), mk(GREY)], [mk([124, 124, 124]), mk(GREY), mk(GREY), mk(GREY)]) === null);

  /* End to end: an RGB scene of a dark-yellow ball on grey membrane. On
     luminance the detector must REFUSE (no contrast); projected onto the
     colour axis it must lock — the projection is what reads the user's bag of
     mixed-colour balls. */
  var W = 128, HH = 128, cx = 60.4, cy = 58.7, rr = 24.3;
  var rgbAt = function (x, y) {
    var d = Math.hypot(x - cx, y - cy);
    var t = (rr - d) / 2 + 0.5;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    var n1 = (x * 7919 + y * 104729) % 11 - 5;
    var n2 = (x * 31 + y * 57) % 9 - 4;
    return [GREY[0] * (1 - t) + YEL[0] * t + n1,
      GREY[1] * (1 - t) + YEL[1] * t + n2,
      GREY[2] * (1 - t) + YEL[2] * t + n1];
  };
  var lum = new Float32Array(W * HH), proj = new Float32Array(W * HH);
  var ringIn = [], ringOut = [];
  for (var a = 0; a < 24; a++) {
    var th = a / 24 * 2 * Math.PI;
    [0.20, 0.42].forEach(function (k) {
      ringIn.push(rgbAt(Math.round(cx + Math.cos(th) * rr * k), Math.round(cy + Math.sin(th) * rr * k)));
    });
    [1.32, 1.55].forEach(function (k) {
      ringOut.push(rgbAt(Math.round(cx + Math.cos(th) * rr * k), Math.round(cy + Math.sin(th) * rr * k)));
    });
  }
  var ax2 = EE.colorAxis(ringIn, ringOut);
  ok('scene axis found', !!ax2, 'null');
  for (var y = 0; y < HH; y++) {
    for (var x = 0; x < W; x++) {
      var c = rgbAt(x, y);
      lum[y * W + x] = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
      proj[y * W + x] = ax2.w[0] * c[0] + ax2.w[1] * c[1] + ax2.w[2] * c[2];
    }
  }
  ok('luminance alone REFUSES the dark-yellow ball', EE.refineCircleEdge(lum, W, HH, 63, 56, 21) === null);
  var lk = EE.refineCircleEdge(proj, W, HH, 63, 56, 21);
  ok('the colour axis LOCKS it', !!lk, 'null');
  ok('…with broad agreement', lk && lk.n >= 34, lk && (lk.n + ' of 48'));
  near('…centre within a pixel', lk ? Math.hypot(lk.cx - cx, lk.cy - cy) : 99, 0, 1.0);
  near('…width within 1.5 px', lk ? lk.dh : 0, 2 * rr, 1.5);
})();

/* ---- the hexagonal panel: an N-point planar reference ---- */
(function () {
  var W = 1512, HH = 2016, f = 1600, h = 1.55;
  var Rtrue = EE.rotFromOrientation(12, 52, -4);
  var side = 0.15;

  /* A hexagon lying on the deck, rotated and offset, projected exactly. */
  var rot = 23 * Math.PI / 180, ox = 0.35, oy = 1.7;
  var world = EE.hexCorners(side).map(function (c) {
    return { x: ox + c.x * Math.cos(rot) - c.y * Math.sin(rot),
             y: oy + c.x * Math.sin(rot) + c.y * Math.cos(rot) };
  });
  var pix = world.map(function (pt) {
    return EE.projectToPixel(pt, Rtrue, h, W, HH, f, 0, 0, [0, 0, 1]);
  });
  ok('hexagon projects into frame', pix.every(Boolean));

  var span = 0;
  pix.forEach(function (a) { pix.forEach(function (b) {
    span = Math.max(span, Math.hypot(a.x - b.x, a.y - b.y)); }); });
  ok('…spanning enough pixels to matter (' + span.toFixed(0) + ' px)', span > 180, span);

  var H = EE.homographyFromPoints(pix, EE.hexCorners(side));
  ok('six-point homography solves', !!H, 'null');
  var res = EE.homographyResidual(H, pix, EE.hexCorners(side));
  ok('…with a residual of essentially zero', res && res.rms < 1e-6, res && res.rms);

  /* Lengths through the fitted map: a 0.5 m square elsewhere on the deck. */
  var sq = [{ x: 0.0, y: 1.6 }, { x: 0.5, y: 1.6 }, { x: 0.5, y: 2.1 }, { x: 0.0, y: 2.1 }];
  var sqPix = sq.map(function (pt) { return EE.projectToPixel(pt, Rtrue, h, W, HH, f, 0, 0, [0, 0, 1]); });
  var g2 = sqPix.map(function (q) { return EE.applyH(H, q); });
  ok('square survives the hexagon homography', g2.every(Boolean));
  var side2 = function (i, j) { return Math.hypot(g2[i].x - g2[j].x, g2[i].y - g2[j].y); };
  near('hexagon-calibrated square, side 1', side2(0, 1), 0.5, 0.002);
  near('hexagon-calibrated square, side 2', side2(1, 2), 0.5, 0.002);

  /* The lens, free of charge, from the same six corners. */
  var foc = EE.focalFromHomography(H, W, HH);
  ok('lens recovered from the hexagon', !!foc && Math.abs(foc.f - f) / f < 0.02,
     foc && foc.f.toFixed(0) + ' vs ' + f);

  /* Winding: a clockwise tap order, put through the app's fix (reverse keeping
     the first), lands the same lengths. */
  var cw = [pix[0]].concat(pix.slice(1).reverse());
  ok('reversed taps have opposite winding', EE.signedArea(cw) * EE.signedArea(pix) < 0);
  var fixed = EE.signedArea(cw) > 0 ? [cw[0]].concat(cw.slice(1).reverse()) : cw;
  var H2 = EE.homographyFromPoints(fixed, EE.hexCorners(side));
  var g3 = sqPix.map(function (q) { return EE.applyH(H2, q); });
  ok('winding-fixed clockwise taps measure identically',
     g3.every(Boolean) && Math.abs(Math.hypot(g3[0].x - g3[1].x, g3[0].y - g3[1].y) - 0.5) < 0.002);

  /* Noisy taps: half-pixel noise on six corners stays a few millimetres. */
  var noisy = pix.map(function (q, i) {
    return { x: q.x + ((i * 37) % 7 - 3) * 0.18, y: q.y + ((i * 53) % 7 - 3) * 0.18 };
  });
  var Hn = EE.homographyFromPoints(noisy, EE.hexCorners(side));
  var rn = EE.homographyResidual(Hn, noisy, EE.hexCorners(side));
  ok('noisy taps: the residual reports the noise', rn && rn.rms > 1e-5 && rn.rms < 0.004, rn && rn.rms);
  var g4 = sqPix.map(function (q) { return EE.applyH(Hn, q); });
  ok('…and a square beside the panel is still true to a centimetre',
     g4.every(Boolean) && Math.abs(Math.hypot(g4[0].x - g4[1].x, g4[0].y - g4[1].y) - 0.5) < 0.01,
     Math.hypot(g4[0].x - g4[1].x, g4[0].y - g4[1].y).toFixed(4));

  /* Model sanity: hexCorners edges and the 0-1-3-4 rectangle. */
  var hc = EE.hexCorners(side);
  var e01 = Math.hypot(hc[1].x - hc[0].x, hc[1].y - hc[0].y);
  near('hexagon edge equals the side', e01, side, 1e-12);
  var r01 = Math.hypot(hc[1].x - hc[0].x, hc[1].y - hc[0].y);
  var r14 = Math.hypot(hc[3].x - hc[1].x, hc[3].y - hc[1].y);
  near('corners 0-1-3-4 form a side × side·√3 rectangle', r14 / r01, Math.sqrt(3), 1e-9);
})();

/* ---- the horizon as an instrument ---- */
(function () {
  var W = 1512, HH = 2016, f = 1600, h = 1.55;
  var nrm3 = function (a) { return Math.hypot(a[0], a[1], a[2]); };
  var angDeg = function (a, b) {
    var c = (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (nrm3(a) * nrm3(b));
    return Math.acos(Math.min(1, Math.max(-1, c))) * 180 / Math.PI;
  };
  var pxOfDev = function (P) {
    var d = [P[0] / nrm3(P), P[1] / nrm3(P), P[2] / nrm3(P)];
    return { x: -f * d[0] / d[2] + W / 2, y: f * d[1] / d[2] + HH / 2 };
  };
  var Rtrue = EE.rotFromOrientation(12, 52, -4);
  var toDev = function (R, v) { return EE.applyM3(EE.transpose3(R), v); };

  /* Two pixels ON the true horizon: world-horizontal directions, in frame. */
  var hpx = [100, 260].map(function (azOff) {
    var az = (90 + 12 - azOff / 10) * Math.PI / 180;   /* near the camera's facing */
    return pxOfDev(toDev(Rtrue, [Math.cos(az), Math.sin(az), 0]));
  });
  var gTrue = toDev(Rtrue, [0, 0, -1]);
  var g = EE.gravityFromHorizon(hpx[0], hpx[1], W, HH, f, 0, gTrue);
  ok('horizon taps yield gravity', !!g, 'null');
  ok('…to a twentieth of a degree', angDeg(g, gTrue) < 0.05, angDeg(g, gTrue).toFixed(4) + '°');

  /* A sensor lying 6°+2° is straightened by the photo. */
  var Rlie = EE.rotFromOrientation(12, 58, -2);
  var out = EE.alignToGravity(Rlie, g);
  ok('the lie is measured (~6.3°)', out.movedDeg > 5.5 && out.movedDeg < 7.2, out.movedDeg);
  ok('corrected attitude puts down where the photo says',
     angDeg(toDev(out.R, [0, 0, -1]), gTrue) < 0.05,
     angDeg(toDev(out.R, [0, 0, -1]), gTrue).toFixed(4));

  /* Euler round trip, including through the corrected matrix. */
  var e = EE.orientationFromRot(out.R);
  var Rback = EE.rotFromOrientation(e.alpha, e.beta, e.gamma);
  var err = 0;
  for (var i = 0; i < 9; i++) err = Math.max(err, Math.abs(Rback[i] - out.R[i]));
  near('orientationFromRot inverts rotFromOrientation', err, 0, 1e-9);
  [[0, 52, -4], [123, -37, 12], [301, 88, 44], [45, -88, -160]].forEach(function (abg) {
    var R0 = EE.rotFromOrientation(abg[0], abg[1], abg[2]);
    var e0 = EE.orientationFromRot(R0);
    var R1 = EE.rotFromOrientation(e0.alpha, e0.beta, e0.gamma);
    var d0 = 0;
    for (var j = 0; j < 9; j++) d0 = Math.max(d0, Math.abs(R0[j] - R1[j]));
    near('euler round trip [' + abg.join(',') + ']', d0, 0, 1e-9);
  });

  /* THE OUTDOOR MONEY SHOT: lying sensor, two horizon taps, and a true square
     through the ray pipeline — the exact route a locked shot takes. */
  var sq = [{ x: 0.3, y: 1.9 }, { x: 0.8, y: 1.9 }, { x: 0.8, y: 2.4 }, { x: 0.3, y: 2.4 }];
  var pixT = sq.map(function (pt) { return EE.projectToPixel(pt, Rtrue, h, W, HH, f, 0, 0, [0, 0, 1]); });
  var Hlock = EE.homographyFromPose(out.R, h, f, W, HH, 0, [0, 0, 1]);
  var gnd = pixT.map(function (q) { return EE.applyH(Hlock, q); });
  ok('locked-attitude homography maps the square', gnd.every(Boolean));
  var sd = function (i2, j2) { return Math.hypot(gnd[i2].x - gnd[j2].x, gnd[i2].y - gnd[j2].y); };
  near('horizon-locked square, side 1', sd(0, 1), 0.5, 0.003);
  near('horizon-locked square, side 2', sd(1, 2), 0.5, 0.003);
  near('horizon-locked square, side 3', sd(2, 3), 0.5, 0.003);

  /* Refusals: taps too close together, or nothing to cross. */
  ok('a 30 px horizon line is refused', EE.gravityFromHorizon(
    { x: 700, y: 900 }, { x: 725, y: 903 }, W, HH, f, 0, gTrue) === null);
})();

/* ---- the principal colour axis ---- */
(function () {
  var ORANGE = [235, 120, 40], GREY = [128, 126, 124];
  var mixed = [];
  for (var i = 0; i < 30; i++) {
    var base = i % 2 ? ORANGE : GREY;
    mixed.push([base[0] + (i % 5) - 2, base[1] + (i % 3) - 1, base[2] + (i % 7) - 3]);
  }
  var pa = EE.principalAxis(mixed);
  ok('a two-material patch yields its axis', !!pa, 'null');
  var diff = [ORANGE[0] - GREY[0], ORANGE[1] - GREY[1], ORANGE[2] - GREY[2]];
  var m = Math.hypot(diff[0], diff[1], diff[2]);
  var alignment = Math.abs(pa.w[0] * diff[0] / m + pa.w[1] * diff[1] / m + pa.w[2] * diff[2] / m);
  ok('…aligned with the material difference', alignment > 0.98, alignment.toFixed(3));
  var flat = [];
  for (i = 0; i < 30; i++) flat.push([128 + (i % 3) - 1, 128, 128]);
  ok('a flat patch yields nothing', EE.principalAxis(flat) === null);
})();

/* ---- adjusting the whole survey at once ---- */
(function () {
  /* Truth: five landmarks; three stations see overlapping subsets from their
     own frames. Station A is the origin. */
  var LM = { a: { x: 0, y: 0 }, b: { x: 4, y: 0.5 }, c: { x: 7.5, y: 2 }, d: { x: 11, y: 1 }, e: { x: 3, y: 5 } };
  var poseTruth = {
    A: { theta: 0, tx: 0, ty: 0 },
    B: { theta: 0.35, tx: 5, ty: -1 },
    C: { theta: -0.55, tx: 9.5, ty: 3 }
  };
  /* observation = inverse-transform of the world landmark into the station frame */
  var obs = function (P, pt) {
    var c = Math.cos(-P.theta), s = Math.sin(-P.theta);
    var x = pt.x - P.tx, y = pt.y - P.ty;
    return { x: c * x - s * y, y: s * x + c * y };
  };
  var sees = { A: ['a', 'b', 'e'], B: ['b', 'c', 'd', 'e'], C: ['c', 'd'] };
  var mk = function (noise) {
    var k = 0;
    return ['A', 'B', 'C'].map(function (id) {
      return {
        id: id, fixed: id === 'A',
        pts: sees[id].map(function (nm) {
          var o = obs(poseTruth[id], LM[nm]);
          k++;
          return { name: nm, x: o.x + (noise ? ((k * 37) % 5 - 2) * 0.01 : 0),
                   y: o.y + (noise ? ((k * 53) % 5 - 2) * 0.01 : 0) };
        })
      };
    });
  };

  var exact = EE.adjust2D(mk(false));
  ok('global adjustment solves', !!exact, 'null');
  near('…station B rotation exact', exact.poses.B.theta, 0.35, 1e-9);
  near('…station C rotation exact', exact.poses.C.theta, -0.55, 1e-9);
  near('…station C x exact', exact.poses.C.tx, 9.5, 1e-8);
  near('…zero residual on perfect data', exact.rms, 0, 1e-9);
  near('…landmark d recovered', Math.hypot(exact.landmarks.d.x - 11, exact.landmarks.d.y - 1), 0, 1e-8);
  near('…linear stage found unit scale', exact.poses.B.scaleLin, 1, 1e-6);

  var noisy = EE.adjust2D(mk(true));
  ok('with 2 cm of tap noise: poses within 4 cm',
     Math.hypot(noisy.poses.C.tx - 9.5, noisy.poses.C.ty - 3) < 0.04,
     Math.hypot(noisy.poses.C.tx - 9.5, noisy.poses.C.ty - 3).toFixed(3));
  ok('…and the residual reports the noise honestly', noisy.rms > 0.001 && noisy.rms < 0.03, noisy.rms);

  /* One station whose calibration is 6% large: the linear stage reads it. */
  var scaled = mk(false);
  scaled[1].pts = scaled[1].pts.map(function (o) { return { name: o.name, x: o.x * 1.06, y: o.y * 1.06 }; });
  var sc = EE.adjust2D(scaled);
  ok('a 6% scale disagreement is measured by the linear stage',
     sc && Math.abs(sc.poses.B.scaleLin - 1 / 1.06) < 0.01,
     sc && sc.poses.B.scaleLin.toFixed(4));

  /* Degenerate: only one shared landmark in total. */
  var thin = [
    { id: 'A', fixed: true, pts: [{ name: 'a', x: 0, y: 0 }] },
    { id: 'B', fixed: false, pts: [{ name: 'a', x: 1, y: 1 }] }
  ];
  ok('one shared landmark is refused', EE.adjust2D(thin) === null);
})();

document.getElementById('out').innerHTML = lines.join('');
document.getElementById('sum').innerHTML = fail === 0
  ? '<span class="ok">ALL ' + pass + ' CHECKS PASSED</span>'
  : '<span class="bad">' + fail + ' FAILED</span> · ' + pass + ' passed';
document.title = fail === 0 ? 'PASS ' + pass : 'FAIL ' + fail;
</script>
</body>
