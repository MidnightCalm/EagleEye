<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eagle Eye — geo.js tests</title>
<style>
  body { background:#0B0910; color:#F4F0E8; font:13px ui-monospace,Menlo,monospace; padding:20px; }
  h1 { font-size:16px; color:#D4AF37; }
  .ok { color:#6ED29A; } .bad { color:#E0897D; }
  #sum { font-size:15px; margin:14px 0; padding:10px; border:1px solid rgba(212,175,55,.4); }
  div.t { padding:2px 0; }
</style>
</head>
<body>
<h1>Eagle Eye — geo.js</h1>
<div id="sum"></div>
<div id="out"></div>
<script src="../geo.js"></script>
<script>
var pass = 0, fail = 0, lines = [];
function ok(name, cond, extra) {
  if (cond) { pass++; lines.push('<div class="t ok">PASS  ' + name + '</div>'); }
  else { fail++; lines.push('<div class="t bad">FAIL  ' + name + (extra ? '  — ' + extra : '') + '</div>'); }
}
function near(name, a, b, tol) {
  var d = Math.abs(a - b);
  ok(name, d <= tol, 'got ' + a + ' want ' + b + ' (d=' + d.toExponential(2) + ')');
}

/* ---- linear solve ---- */
(function () {
  var x = EE.solveLinear([[2, 1], [1, 3]], [5, 10]);
  near('solveLinear x', x[0], 1, 1e-9);
  near('solveLinear y', x[1], 3, 1e-9);
  ok('solveLinear singular -> null', EE.solveLinear([[1, 2], [2, 4]], [1, 2]) === null);
})();

/* ---- rotation matrix ---- */
(function () {
  var R = EE.rotFromOrientation(0, 90, 0);
  var camAxis = EE.applyM3(R, [0, 0, -1]);       /* rear camera looks down device -Z */
  near('upright phone: camera points north (y)', camAxis[1], 1, 1e-9);
  near('upright phone: camera level (z)', camAxis[2], 0, 1e-9);
  var up = EE.applyM3(R, [0, 1, 0]);
  near('upright phone: screen-top is world up', up[2], 1, 1e-9);

  /* orthonormal for an arbitrary attitude */
  var Q = EE.rotFromOrientation(37, 62, -18);
  var I = EE.mul3(Q, EE.transpose3(Q));
  var err = 0;
  [1, 0, 0, 0, 1, 0, 0, 0, 1].forEach(function (v, i) { err = Math.max(err, Math.abs(I[i] - v)); });
  near('rotation is orthonormal', err, 0, 1e-12);

  var Rflat = EE.rotFromOrientation(0, 0, 0);
  var down = EE.applyM3(Rflat, [0, 0, -1]);
  near('flat phone: camera points straight down', down[2], -1, 1e-9);
})();

/* ---- attitude quaternions ---- */
(function () {
  /* The quaternion path must reproduce the Euler matrix exactly, or frame
     attitudes and shutter attitudes would disagree. */
  var worst = 0;
  [[0,90,0],[37,62,-18],[180,10,80],[-140,-75,44],[359,89,-89],[0,0,0]].forEach(function (e) {
    var A = EE.rotFromOrientation(e[0], e[1], e[2]);
    var B = EE.quatToMatrix(EE.quatFromOrientation(e[0], e[1], e[2]));
    for (var i = 0; i < 9; i++) worst = Math.max(worst, Math.abs(A[i] - B[i]));
  });
  near('quaternion attitude matches the Euler matrix', worst, 0, 1e-12);

  /* Slerp endpoints and midpoint. */
  var qa = EE.quatFromOrientation(0, 60, 0), qb = EE.quatFromOrientation(40, 60, 0);
  near('slerp at t=0 is the first sample', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0), qa), 0, 1e-9);
  near('slerp at t=1 is the second sample', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 1), qb), 0, 1e-9);
  near('slerp midpoint is equidistant',
       EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qa) - EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qb), 0, 1e-9);
  near('slerp midpoint of a 40 deg pan is 20 deg', EE.quatAngleDeg(EE.quatSlerp(qa, qb, 0.5), qa), 20, 1e-9);

  /* The wraparound that naive Euler interpolation gets catastrophically wrong:
     halfway between alpha 359 and alpha 1 must be alpha 0, not alpha 180. */
  var w1 = EE.quatFromOrientation(359, 60, 0), w2 = EE.quatFromOrientation(1, 60, 0);
  var mid = EE.quatSlerp(w1, w2, 0.5);
  near('slerp crosses the alpha wrap correctly',
       EE.quatAngleDeg(mid, EE.quatFromOrientation(0, 60, 0)), 0, 1e-9);
  ok('naive Euler averaging would have pointed the camera backwards',
     Math.abs((359 + 1) / 2 - 180) < 1e-9);

  /* Antipodal representations are the same rotation and must not spin the long way. */
  var q = EE.quatFromOrientation(20, 55, 3);
  var negq = [-q[0], -q[1], -q[2], -q[3]];
  near('antipodal quaternions are the same attitude', EE.quatAngleDeg(q, negq), 0, 1e-6);
  near('slerp between antipodes does not travel', EE.quatAngleDeg(EE.quatSlerp(q, negq, 0.5), q), 0, 1e-6);

  near('quatAngleDeg of a known 30 deg pan',
       EE.quatAngleDeg(EE.quatFromOrientation(0, 90, 0), EE.quatFromOrientation(30, 90, 0)), 30, 1e-9);
})();

/* ---- ray cast: closed-form check ---- */
(function () {
  /* alpha 0, beta 60 -> camera depressed 30 deg below horizon, facing north. */
  var R = EE.rotFromOrientation(0, 60, 0);
  var g = EE.groundPoint([0, 0, -1], R, 1.6, 0);
  near('groundPoint range matches 1.6/tan30', g.y, 1.6 / Math.tan(30 * Math.PI / 180), 1e-9);
  near('groundPoint has no east offset', g.x, 0, 1e-12);
  ok('ray above horizon -> null', EE.groundPoint([0, 0, -1], EE.rotFromOrientation(0, 100, 0), 1.6, 0) === null);
})();

/* ---- pixel <-> ground round trip, portrait and landscape ---- */
[0, 90, 180, 270].forEach(function (ang) {
  var W = 1440, H = 1920, f = EE.focalFromFov(69, Math.max(W, H));
  var R = EE.rotFromOrientation(23, 58, -7), camH = 1.55;
  var worst = 0, tested = 0;
  for (var px = 200; px <= W - 200; px += 400) {
    for (var py = 200; py <= H - 200; py += 400) {
      var ray = EE.rayForPixel(px, py, W, H, f, ang);
      var gp = EE.groundPoint(ray, R, camH, 0);
      if (!gp) continue;
      var back = EE.projectToPixel(gp, R, camH, W, H, f, ang, 0);
      if (!back) { worst = Infinity; continue; }
      worst = Math.max(worst, Math.hypot(back.x - px, back.y - py));
      tested++;
    }
  }
  ok('pixel round trip @' + ang + ' deg covered pixels', tested >= 4, 'tested=' + tested);
  near('pixel round trip @' + ang + ' deg max error px', worst, 0, 1e-6);
});

/* ---- homography agrees with the ray model ----
   Synthesise a camera, project four known ground corners into pixels, solve the
   homography from those alone, then check it reproduces the ray model elsewhere.
   This cross-validates the two independent engines against each other. */
(function () {
  var W = 1440, H = 1920, f = EE.focalFromFov(69, H);
  var R = EE.rotFromOrientation(15, 55, 4), camH = 1.6;

  var refGround = EE.rectRefCorners(2.4, 1.2).map(function (p) { return { x: p.x + 1, y: p.y + 4 }; });
  var refPix = refGround.map(function (p) { return EE.projectToPixel(p, R, camH, W, H, f, 0, 0); });
  ok('reference corners all in front of camera', refPix.every(Boolean));

  var Href = EE.rectRefCorners(2.4, 1.2);
  var Hm = EE.homographyFromQuad(refPix, Href);
  ok('homography solved', !!Hm);

  /* Any other pixel: homography result should match the ray model, offset by the
     same (1,4) shift that separates the two coordinate frames. */
  var worst = 0;
  for (var px = 300; px < W - 300; px += 300) {
    for (var py = 900; py < H - 200; py += 300) {
      var g = EE.groundPoint(EE.rayForPixel(px, py, W, H, f, 0), R, camH, 0);
      if (!g) continue;
      var hp = EE.applyH(Hm, { x: px, y: py });
      if (!hp) { worst = Infinity; continue; }
      worst = Math.max(worst, Math.hypot(hp.x - (g.x - 1), hp.y - (g.y - 4)));
    }
  }
  near('homography vs ray model, max disagreement (m)', worst, 0, 1e-6);

  ok('applyH above horizon -> null or far', (function () {
    var p = EE.applyH(Hm, { x: 720, y: 5 });
    return p === null || Math.abs(p.y) > 100;
  })());
})();

/* ---- focal length recovered from a homography ---- */
(function () {
  var W = 1080, H = 1440;

  /* Synthesise a camera at a KNOWN focal length, project a rectangle, solve the
     homography from those four corners alone, and see if f comes back. */
  [58, 68, 77, 90].forEach(function (fovDeg) {
    var f = EE.focalFromFov(fovDeg, Math.max(W, H));
    var R = EE.rotFromOrientation(11, 57, -5), camH = 1.55;
    var ref = EE.rectRefCorners(2.4, 1.2);
    var pix = ref.map(function (p) {
      return EE.projectToPixel({ x: p.x + 1, y: p.y + 4 }, R, camH, W, H, f, 0, 0);
    });
    var Hm = EE.homographyFromQuad(pix, ref);
    var got = EE.focalFromHomography(Hm, W, H);
    ok('focal recovered at ' + fovDeg + ' deg fov', got && Math.abs(got.f - f) / f < 1e-6,
       got && (got.f.toFixed(1) + ' vs ' + f.toFixed(1)));
    ok('  and both estimates agree at ' + fovDeg, got.disagree < 1e-6, got && got.disagree);
    near('  round trips back to the fov', EE.fovFromFocalLong(got.f, Math.max(W, H)), fovDeg, 1e-6);
  });

  /* The regression this exists for: assuming 68 deg when the lens is 77 deg puts
     the horizon badly wrong, and the recovered value says so. */
  var fTrue = EE.focalFromFov(77, Math.max(W, H));
  var fAssumed = EE.focalFromFov(68, Math.max(W, H));
  var R2 = EE.rotFromOrientation(0, 58, 0);
  var hTrue = EE.homographyFromPose(R2, 1.55, fTrue, W, H, 0);
  var hAssumed = EE.homographyFromPose(R2, 1.55, fAssumed, W, H, 0);
  var horA = EE.horizonLine(hTrue, W, H), horB = EE.horizonLine(hAssumed, W, H);
  ok('a 9 deg fov error moves the horizon by many pixels',
     Math.abs(horA.y0 - horB.y0) > 25, Math.abs(horA.y0 - horB.y0).toFixed(0) + ' px');

  /* The everyday degeneracy, and the one that produced a confident wrong answer:
     no roll and no yaw relative to the reference, so one constraint's denominator
     collapses to floating-point noise. It must fall back to the constraint that
     still works rather than average in garbage. */
  (function () {
    var fx = EE.focalFromFov(77, Math.max(W, H));
    var Rlevel = EE.rotFromOrientation(0, 58, 0);       /* alpha 0, gamma 0 */
    var ref = EE.rectRefCorners(2.4, 1.2);
    var pix = ref.map(function (p) {
      return EE.projectToPixel({ x: p.x - 1.2, y: p.y + 2.0 }, Rlevel, 1.55, W, H, fx, 0, 0);
    });
    var got = EE.focalFromHomography(EE.homographyFromQuad(pix, ref), W, H);
    ok('an unrolled, unyawed shot still recovers the lens',
       got && Math.abs(got.f - fx) / fx < 1e-6, got && (got.f.toFixed(1) + ' vs ' + fx.toFixed(1)));
    ok('and it does so from one constraint, not a bogus average',
       got && got.fOrtho === null && got.fEqual != null,
       got && ('ortho=' + got.fOrtho + ' equal=' + (got.fEqual && got.fEqual.toFixed(1))));
    ok('so it reports no self-check rather than a false one', got && got.disagree === null);
  })();

  /* Straight down is the genuinely degenerate case: a fronto-parallel plane makes
     the homography a similarity, both perspective terms vanish, and there is no
     focal length to be had. It must return nothing rather than a confident guess. */
  var fx = EE.focalFromFov(68, Math.max(W, H));
  var refF = EE.rectRefCorners(2.4, 1.2);
  var nadir = refF.map(function (p) {
    return EE.projectToPixel({ x: p.x - 1.2, y: p.y - 0.6 },
      EE.rotFromOrientation(0, 0, 0), 3.0, W, H, fx, 0, 0);
  });
  var hNadir = EE.homographyFromQuad(nadir, refF);
  ok('a nadir view yields no focal length', EE.focalFromHomography(hNadir, W, H) === null,
     JSON.stringify(EE.focalFromHomography(hNadir, W, H)));

  /* But it needs very little tilt to work — 2 degrees is already enough, which
     matters because it means almost any real shot can calibrate its own lens. */
  var tilted = refF.map(function (p) {
    return EE.projectToPixel({ x: p.x - 1.2, y: p.y - 0.6 },
      EE.rotFromOrientation(0, 2, 0), 3.0, W, H, fx, 0, 0);
  });
  var got2 = EE.focalFromHomography(EE.homographyFromQuad(tilted, refF), W, H);
  ok('two degrees of tilt already recovers it', got2 && Math.abs(got2.f - fx) / fx < 1e-6,
     got2 && got2.f.toFixed(1) + ' vs ' + fx.toFixed(1));
  ok('though with only one usable constraint, so it cannot self-check',
     got2.disagree === null, got2.disagree);

  ok('a singular matrix yields nothing', EE.focalFromHomography([1,0,0, 2,0,0, 3,0,0], W, H) === null);
})();

/* ---- horizon line ---- */
(function () {
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var R = EE.rotFromOrientation(0, 58, 0);
  var Hm = EE.homographyFromPose(R, 1.55, f, W, H, 0);
  var hor = EE.horizonLine(Hm, W, H);
  ok('horizon reported', !!hor);
  near('level camera: horizon is flat across the frame', hor.y0, hor.y1, 1e-9);

  /* w must be exactly zero on the reported line, and positive below it. */
  var wAt = function (x, y) { return Hm[6]*x + Hm[7]*y + Hm[8]; };
  near('w is zero on the horizon', wAt(0, hor.y0), 0, 1e-12);
  ok('w is positive below it', wAt(W/2, hor.y0 + 50) > 0);
  ok('w is negative above it', wAt(W/2, hor.y0 - 50) < 0);

  /* Rolling the phone must tilt the horizon in the image. */
  var rolled = EE.homographyFromPose(EE.rotFromOrientation(0, 58, 20), 1.55, f, W, H, 0);
  var hr = EE.horizonLine(rolled, W, H);
  ok('a rolled phone tilts the horizon', Math.abs(hr.y0 - hr.y1) > 100,
     Math.abs(hr.y0 - hr.y1).toFixed(0) + ' px across the frame');

  /* A wrongly-rotated frame turns the horizon vertical. The y = f(x) form alone
     returned nothing here, which hid the very failure this is meant to expose. */
  var sideways = EE.homographyFromPose(R, 1.55, f, W, H, 90);
  var hs = EE.horizonLine(sideways, W, H);
  ok('a 90 deg frame rotation gives a vertical horizon', hs && hs.steep, JSON.stringify(hs));
  ok('and it is still a drawable segment',
     hs && isFinite(hs.x0) && isFinite(hs.x1) && isFinite(hs.y0) && isFinite(hs.y1));
  near('running the full height of the frame', Math.abs(hs.y1 - hs.y0), H, 1e-9);

  /* w must still flip sign across it, whichever way it runs. */
  var wS = function (x, y) { return sideways[6]*x + sideways[7]*y + sideways[8]; };
  var mx = (hs.x0 + hs.x1) / 2, my = (hs.y0 + hs.y1) / 2;
  ok('sign flips across a vertical horizon too', wS(mx - 60, my) * wS(mx + 60, my) < 0);
})();

/* ---- the deck plane from gravity ---- */
(function () {
  var D = Math.PI / 180;

  /* A phone lying face-up on a level deck reports the normal as world up. */
  var flat = EE.normalFromAttitude(0, 0, 0, false);
  near('level deck normal is world up', flat[2], 1, 1e-12);
  near('deck tilt of a level deck is zero', EE.deckTiltDeg(flat), 0, 1e-12);

  /* Face down, the device +Z points into the deck, so the sign must flip. */
  var down = EE.normalFromAttitude(0, 180, 0, true);
  near('face-down on a level deck still yields up', down[2], 1, 1e-9);

  /* A 2% drainage fall is 1.15 deg, which the reading must actually show. */
  var slope = EE.normalFromAttitude(0, 1.1458, 0, false);
  near('a 2% fall reads as 1.15 deg', EE.deckTiltDeg(slope), 1.1458, 1e-4);

  var b = EE.deckBasis(flat);
  near('level basis e1 is world east', b.e1[0], 1, 1e-12);
  near('level basis e2 is world north', b.e2[1], 1, 1e-12);

  var bs = EE.deckBasis(slope);
  var dot = function (u, v) { return u[0]*v[0] + u[1]*v[1] + u[2]*v[2]; };
  near('tilted basis stays orthonormal (e1.e2)', dot(bs.e1, bs.e2), 0, 1e-12);
  near('tilted basis lies in the deck (e1.n)', dot(bs.e1, slope), 0, 1e-12);
  near('tilted basis lies in the deck (e2.n)', dot(bs.e2, slope), 0, 1e-12);
  near('tilted basis e1 is unit', Math.hypot(bs.e1[0],bs.e1[1],bs.e1[2]), 1, 1e-12);

  /* Passing a level normal explicitly must change nothing anywhere. */
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W,H));
  var R = EE.rotFromOrientation(17, 57, -4), camH = 1.55;
  var worst = 0;
  for (var px = 120; px < W; px += 260) {
    for (var py = 700; py < H; py += 260) {
      var a1 = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0);
      var a2 = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0, [0,0,1]);
      if (!a1 || !a2) continue;
      worst = Math.max(worst, Math.hypot(a1.x-a2.x, a1.y-a2.y));
    }
  }
  near('an explicit level normal is a no-op', worst, 0, 1e-12);

  var Hl = EE.homographyFromPose(R, camH, f, W, H, 0);
  var Hn = EE.homographyFromPose(R, camH, f, W, H, 0, [0,0,1]);
  var hw = 0; for (var i=0;i<9;i++) hw = Math.max(hw, Math.abs(Hl[i]-Hn[i]));
  near('and the pose homography is unchanged', hw, 0, 1e-12);

  /* On a TILTED deck the whole chain must stay self-consistent. */
  var n = EE.normalFromAttitude(0, 2.5, 1.5, false);
  var Ht = EE.homographyFromPose(R, camH, f, W, H, 0, n);
  var worstT = 0, cases = 0;
  for (px = 120; px < W; px += 200) {
    for (py = 760; py < H; py += 200) {
      var g = EE.groundPoint(EE.rayForPixel(px,py,W,H,f,0), R, camH, 0, n);
      if (!g) continue;
      var viaH = EE.applyH(Ht, {x:px, y:py});
      if (!viaH) { worstT = Infinity; continue; }
      worstT = Math.max(worstT, Math.hypot(viaH.x-g.x, viaH.y-g.y));
      var back = EE.projectToPixel(g, R, camH, W, H, f, 0, 0, n);
      worstT = Math.max(worstT, Math.hypot(back.x-px, back.y-py) * 1e-6);
      cases++;
    }
  }
  ok('tilted-deck cases covered', cases > 8, cases);
  near('pose homography, ray cast and reprojection all agree on a tilted deck', worstT, 0, 1e-8);

  /* Height still comes back right when the deck is not level. */
  var base = {x: 1.2, y: 7.0}, objH = 1.35;
  var bp = EE.projectToPixel(base, R, camH, W, H, f, 0, 0, n);
  var tp = EE.projectToPixel(base, R, camH, W, H, f, 0, objH, n);
  var gb = EE.groundPoint(EE.rayForPixel(bp.x,bp.y,W,H,f,0), R, camH, 0, n);
  var hm = EE.heightFromBaseTop(gb, EE.rayForPixel(tp.x,tp.y,W,H,f,0), R, camH, n);
  near('height on a tilted deck recovers 1.35 m', hm, objH, 1e-8);

  /* Ignoring a real slope costs range error, which is the point of measuring it. */
  var gTilt = EE.groundPoint(EE.rayForPixel(W/2, H*0.72, W,H,f,0), R, camH, 0, n);
  var gFlat = EE.groundPoint(EE.rayForPixel(W/2, H*0.72, W,H,f,0), R, camH, 0);
  ok('a 3 deg slope moves a mid-field point measurably',
     Math.hypot(gTilt.x-gFlat.x, gTilt.y-gFlat.y) > 0.05,
     Math.hypot(gTilt.x-gFlat.x, gTilt.y-gFlat.y).toFixed(3) + ' m');

  /* Scale-from-known-length must work on a tilted deck too. */
  var pa = EE.projectToPixel({x:-1.5,y:6}, R, 1.72, W,H,f,0,0,n);
  var pb = EE.projectToPixel({x: 1.5,y:6}, R, 1.72, W,H,f,0,0,n);
  var solved = EE.camHeightFromKnown(
      EE.rayForPixel(pa.x,pa.y,W,H,f,0), EE.rayForPixel(pb.x,pb.y,W,H,f,0), R, 3.0, n);
  near('camera height solves on a tilted deck', solved, 1.72, 1e-9);
})();

/* ---- corner snapping ---- */
(function () {
  /* A synthetic dark quadrant on a light field: the corner is at (cx, cy). */
  var mk = function (w, h, cx, cy, noise) {
    var g = new Float32Array(w * h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var v = (x < cx && y < cy) ? 40 : 200;
      if (noise) v += ((x * 7919 + y * 104729) % 17 - 8) * noise;
      g[y * w + x] = v;
    }
    return g;
  };

  var N = 41;
  var c = EE.bestCorner(mk(N, N, 20, 20, 0), N, N, 8);
  ok('finds a corner at the patch centre', c && Math.hypot(c.x - 19.5, c.y - 19.5) <= 1.5,
     c && (c.x + ',' + c.y));
  ok('and reports it as far above the local texture', c.ratio > 20, c.ratio.toFixed(1));

  /* Offset corner: it must snap TO the corner, not stay at the tap. */
  var off = EE.bestCorner(mk(N, N, 26, 15, 0), N, N, 8);
  ok('snaps to an off-centre corner', Math.hypot(off.x - 25.5, off.y - 14.5) <= 1.5,
     off.x + ',' + off.y);
  ok('and reports how far it moved', off.dist > 4, off.dist.toFixed(1));

  /* A straight EDGE is not a corner — Shi-Tomasi must not reward it. */
  var edge = new Float32Array(N * N);
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) edge[y * N + x] = x < 20 ? 40 : 200;
  var e = EE.bestCorner(edge, N, N, 8);
  ok('an edge scores far lower than a corner', e.lambda < c.lambda / 50,
     e.lambda.toFixed(1) + ' vs ' + c.lambda.toFixed(1));

  /* Blank membrane must not manufacture a corner from noise. */
  var blank = new Float32Array(N * N);
  for (var i = 0; i < blank.length; i++) blank[i] = 128 + ((i * 7919) % 5 - 2) * 0.4;
  var bl = EE.bestCorner(blank, N, N, 8);
  ok('a featureless patch yields a weak response', bl.lambda < c.lambda / 200,
     bl.lambda.toFixed(2));

  /* The distance prior must stop it wandering to a better corner far away. */
  var two = mk(N, N, 21, 21, 0);

/* ---- pose expressed as a homography must reproduce the ray cast exactly ---- */
[0, 90, 180, 270].forEach(function (ang) {
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var R = EE.rotFromOrientation(31, 57, -6), camH = 1.62;
  var Hm = EE.homographyFromPose(R, camH, f, W, H, ang);
  ok('homographyFromPose builds @' + ang, !!Hm);

  var worst = 0, n = 0;
  for (var px = 60; px <= W - 60; px += 170) {
    for (var py = 60; py <= H - 60; py += 170) {
      var ray = EE.groundPoint(EE.rayForPixel(px, py, W, H, f, ang), R, camH, 0);
      var hom = EE.applyH(Hm, { x: px, y: py });
      /* Both engines must agree on which pixels are sky. */
      if (!ray) { ok('sky pixel rejected by both @' + ang, !hom || (Hm[6]*px + Hm[7]*py + Hm[8]) <= 0); continue; }
      if (!hom) { worst = Infinity; continue; }
      worst = Math.max(worst, Math.hypot(hom.x - ray.x, hom.y - ray.y));
      n++;
    }

  ok('pose homography covered ground pixels @' + ang, n > 10, 'n=' + n);
  near('pose homography == ray cast @' + ang + ' (m)', worst, 0, 1e-9);

/* ---- w > 0 is a valid horizon test for BOTH constructions ---- */
(function () {
  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var R = EE.rotFromOrientation(0, 58, 0), camH = 1.6;
  var Hp = EE.homographyFromPose(R, camH, f, W, H, 0);
  var wAt = function (Hm, x, y) { return Hm[6]*x + Hm[7]*y + Hm[8]; };
  ok('pose H: bottom of frame is in front (w>0)', wAt(Hp, W/2, H - 10) > 0);
  ok('pose H: top of frame is sky (w<=0)', wAt(Hp, W/2, 10) <= 0);

  /* the quad solver picks an arbitrary sign; orientH must pin it the same way */
  var ref = EE.rectRefCorners(2.4, 1.2);
  var pix = ref.map(function (p) { return EE.projectToPixel({x: p.x + 1, y: p.y + 5}, R, camH, W, H, f, 0, 0); });
  var Hq = EE.homographyFromQuad(pix, ref);
  ok('quad H: reference corners all have w>0', pix.every(function (p) { return wAt(Hq, p.x, p.y) > 0; }));
  ok('quad H: sky has w<=0', wAt(Hq, W/2, 10) <= 0);

  /* negating the input solution must not change the oriented result */
  var flipped = EE.orientH([-Hq[0],-Hq[1],-Hq[2],-Hq[3],-Hq[4],-Hq[5],-Hq[6],-Hq[7],-Hq[8]], pix[0]);
  var d = 0; for (var i = 0; i < 9; i++) d = Math.max(d, Math.abs(flipped[i] - Hq[i]));
  near('orientH is idempotent under sign flip', d, 0, 1e-12);
})();

/* ---- ground sampling distance (worst direction) ---- */
(function () {
  /* A pure scale homography is isotropic: both singular values are s. */
  var s = 0.017;
  near('gsd of a pure scale map', EE.gsdAtPixel([s,0,0, 0,s,0, 0,0,1], {x: 123, y: 456}), s, 1e-12);
  /* An anisotropic map must report the WORSE axis, not the average. */
  near('gsd reports the worse axis of an anisotropic map',
       EE.gsdAtPixel([0.02,0,0, 0,0.5,0, 0,0,1], {x: 10, y: 10}), 0.5, 1e-12);

  var W = 1080, H = 1440, f = EE.focalFromFov(68, Math.max(W, H));
  var R = EE.rotFromOrientation(0, 58, 0), camH = 1.6;
  var Hm = EE.homographyFromPose(R, camH, f, W, H, 0);

  var nearG = EE.gsdAtPixel(Hm, {x: W/2, y: H - 40});
  var farG  = EE.gsdAtPixel(Hm, {x: W/2, y: H * 0.62});
  ok('gsd degrades towards the horizon', farG > nearG * 2, nearG.toFixed(4) + ' -> ' + farG.toFixed(4));
  ok('gsd at the bottom of frame is centimetric', nearG > 0.0002 && nearG < 0.02, nearG);
  ok('gsd above the horizon is infinite', EE.gsdAtPixel(Hm, {x: W/2, y: 10}) === Infinity);

  /* The regression this metric exists for. Anisotropy grows as r/h, so it has to
     be measured near the horizon — the horizon's pixel row is where w = 0, so
     solve for it rather than guessing a fraction of the frame. */
  var horizonY = -(Hm[8] + Hm[6] * (W/2)) / Hm[7];
  ok('horizon lies inside the frame', horizonY > 0 && horizonY < H, horizonY);

  var ratioAt = function (y) {
    var q = {x: W/2, y: y};
    var J = EE.jacobianAtPixel(Hm, q);
    return EE.gsdAtPixel(Hm, q) / Math.sqrt(Math.abs(J[0]*J[3] - J[1]*J[2]));
  };
  var grazing = ratioAt(horizonY + 40), close = ratioAt(H - 40);
  ok('anisotropy grows towards the horizon', grazing > close * 2,
     'close ' + close.toFixed(2) + 'x -> grazing ' + grazing.toFixed(2) + 'x');
  ok('a grazing pixel is several times worse than its determinant mean suggests',
     grazing > 3, grazing.toFixed(2) + 'x');
  ok('and close in, the two metrics nearly agree', close < 1.35, close.toFixed(2) + 'x');

  /* Central differences: second-order, so this actually tests the analytic form
     rather than the truncation error of a one-sided step. */
  /* h = 0.1 px: central-difference truncation falls as h^2, so a whole-pixel step
     leaves ~1e-9 of its own error and would be testing the approximation rather
     than the analytic form. */
  var p = {x: W/2, y: H*0.8}, hh = 0.1;
  var du = [EE.applyH(Hm, {x: p.x+hh, y: p.y}), EE.applyH(Hm, {x: p.x-hh, y: p.y})];
  var dv = [EE.applyH(Hm, {x: p.x, y: p.y+hh}), EE.applyH(Hm, {x: p.x, y: p.y-hh})];
  var fd = [(du[0].x-du[1].x)/(2*hh), (dv[0].x-dv[1].x)/(2*hh),
            (du[0].y-du[1].y)/(2*hh), (dv[0].y-dv[1].y)/(2*hh)];
  var Ja = EE.jacobianAtPixel(Hm, p);
  var dmax = 0; for (var i = 0; i < 4; i++) dmax = Math.max(dmax, Math.abs(fd[i] - Ja[i]));
  near('analytic Jacobian matches central differences', dmax, 0, 1e-10);

  /* The bisected clip must sit right on the limit. */
  var lim = 0.05;
  var wl = EE.wForGsd(Hm, W, H, lim);
  var fpv = EE.clipHalfPlane([{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}], Hm[6], Hm[7], Hm[8] - wl);
  var worst = 0; fpv.forEach(function (q) { worst = Math.max(worst, EE.gsdAtPixel(Hm, q)); });
  ok('clip meets the quality limit', worst <= lim + 1e-6, worst);
  ok('clip is not needlessly conservative', worst > lim * 0.9, worst);

  /* A nadir view of the same roof is uniformly good, so nothing gets clipped. */
  var down = EE.homographyFromPose(EE.rotFromOrientation(0, 0, 0), camH, f, W, H, 0);
  near('nadir view needs no clipping', EE.wForGsd(down, W, H, 0.05), 1e-9, 1e-12);
})();

/* ---- position error: the only honest confidence metric ---- */
(function () {
  var camH = 1.55, d = 10;

  /* Validate the closed form against the real projection rather than against any
     asserted figure: aim the camera axis at a point 10 m out, nudge the tilt, and
     measure how far the intersection actually travels. */
  var depression = Math.atan(camH / d);
  var beta = 90 - depression * 180 / Math.PI;
  var yAt = function (b) {
    return EE.groundPoint([0, 0, -1], EE.rotFromOrientation(0, b, 0), camH, 0).y;
  };
  near('camera axis lands where intended', yAt(beta), d, 1e-9);

  var eps = 1e-4;                                    /* degrees */
  var measured = Math.abs(yAt(beta + eps) - yAt(beta - eps)) / (2 * eps * Math.PI / 180);
  near('bearingSensitivity matches the real projection (m per rad)',
       EE.bearingSensitivity(camH, d), measured, 1e-3);
  near('and it is (h^2 + d^2)/h', EE.bearingSensitivity(camH, d), (camH*camH + d*d)/camH, 1e-12);

  var half = 0.5 * Math.PI / 180;
  var sig = EE.positionSigma(camH, d, half, 0);
  near('half a degree at 10 m moves the point 58 cm', sig, 0.5766, 5e-4);
  ok('position error grows quadratically, not linearly',
     EE.positionSigma(camH, 20, half, 0) / sig > 3.5,
     (EE.positionSigma(camH, 20, half, 0) / sig).toFixed(2) + 'x for 2x the range');

  /* Standing closer is worth more than any amount of resolution. */
  ok('halving the range cuts the error roughly fourfold',
     EE.positionSigma(camH, 5, half, 0) < sig / 3.4,
     EE.positionSigma(camH, 5, half, 0).toFixed(3));

  /* Deck uncertainty is a separate, declared term. */
  near('deck uncertainty drags the point out by delta.d/h',
       EE.positionSigma(camH, d, 0, 0.08), 0.08 * d / camH, 1e-12);
  near('the two combine in quadrature',
       EE.positionSigma(camH, d, half, 0.08),
       Math.hypot(0.5766, 0.08 * d / camH), 5e-4);

  /* The trusted radius must invert the sigma exactly — attitude alone... */
  [0.10, 0.25, 0.50].forEach(function (tol) {
    var r = EE.maxTrustedRange(camH, half, tol);
    near('maxTrustedRange(' + tol + ' m) inverts positionSigma', EE.positionSigma(camH, r, half, 0), tol, 1e-9);
  });
  near('trusted radius at 0.25 m tolerance is 6.5 m', EE.maxTrustedRange(camH, half, 0.25), 6.481, 2e-3);

  /* ...and with the deck term too, or the ring disagrees with the colour inside
     it. This is the regression: the radius and the coverage colouring must use
     one sigma. */
  [[0.10, 0.05], [0.25, 0.08], [0.50, 0.15]].forEach(function (pair) {
    var r = EE.maxTrustedRange(camH, half, pair[0], pair[1]);

  ok('deck uncertainty shrinks the trusted radius',
     EE.maxTrustedRange(camH, half, 0.25, 0.08) < EE.maxTrustedRange(camH, half, 0.25),
     EE.maxTrustedRange(camH, half, 0.25, 0.08).toFixed(2) + ' m vs ' + EE.maxTrustedRange(camH, half, 0.25).toFixed(2) + ' m');
  near('deck 0 reduces to the attitude-only closed form',
       EE.maxTrustedRange(camH, half, 0.25, 0), EE.maxTrustedRange(camH, half, 0.25), 1e-12);

  ok('a degree of skew nearly halves the trusted radius',
     EE.maxTrustedRange(camH, 2 * half, 0.25) < EE.maxTrustedRange(camH, half, 0.25) * 0.72,
     EE.maxTrustedRange(camH, 2*half, 0.25).toFixed(2) + ' m vs ' + EE.maxTrustedRange(camH, half, 0.25).toFixed(2) + ' m');
  ok('an impossible tolerance yields no radius', EE.maxTrustedRange(camH, half, 0.001) === 0);

     Math.hypot(far.x, far.y).toFixed(1) + ' m');

  var pTop = EE.projectToPixel(base, R, camH, W, H, f, 0, objH);
  ok('base and top both project', !!pBase && !!pTop);
  var g = EE.groundPoint(EE.rayForPixel(pBase.x, pBase.y, W, H, f, 0), R, camH, 0);
  var h = EE.heightFromBaseTop(g, EE.rayForPixel(pTop.x, pTop.y, W, H, f, 0), R, camH);
  near('heightFromBaseTop recovers 1.35 m', h, 1.35, 1e-8);
})();

/* ---- oriented rectangle fit ---- */
(function () {
  var rot = 0.37, cx = 12, cy = -5, w = 2.0, l = 3.5;
  var c = Math.cos(rot), s = Math.sin(rot);
  var pts = [[-w / 2, -l / 2], [w / 2, -l / 2], [w / 2, l / 2], [-w / 2, l / 2]].map(function (p) {
    return { x: cx + p[0] * c - p[1] * s, y: cy + p[0] * s + p[1] * c };
  });
  var r = EE.fitOrientedRect(pts);
  near('rect fit width', r.w, w, 1e-9);
  near('rect fit length', r.l, l, 1e-9);
  near('rect fit cx', r.cx, cx, 1e-9);
  near('rect fit cy', r.cy, cy, 1e-9);
  near('rect fit rotation', r.rot, rot, 1e-9);

  /* Tap order must not change the answer. */
  var r2 = EE.fitOrientedRect([pts[2], pts[0], pts[3], pts[1]]);
  near('rect fit is tap-order independent', Math.hypot(r2.w - r.w, r2.l - r.l), 0, 1e-9);

  /* Corners must survive a fit -> corners -> fit round trip. */
  var back = EE.fitOrientedRect(EE.rectCorners(r));
  near('rectCorners round trip', Math.hypot(back.cx - cx, back.cy - cy), 0, 1e-9);

  /* Three corners of a rectangle still recover it. */
  var r3 = EE.fitOrientedRect([pts[0], pts[1], pts[2]]);
  near('rect fit from 3 corners: width', r3.w, w, 1e-9);
  near('rect fit from 3 corners: length', r3.l, l, 1e-9);
})();

/* ---- circle fit ---- */
(function () {
  var c = EE.fitCircle([{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }]);
  near('circle fit r', c.r, 1, 1e-9);
  near('circle fit cx', c.cx, 0, 1e-9);

  var pts = [], cx = 4.2, cy = -1.1, r = 0.63;
  for (var i = 0; i < 9; i++) {
    var a = i / 9 * Math.PI * 2;
    pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
  }
  var f = EE.fitCircle(pts);
  near('circle fit many: r', f.r, r, 1e-9);
  near('circle fit many: centre', Math.hypot(f.cx - cx, f.cy - cy), 0, 1e-9);
  near('circlePoly area approaches pi r^2', EE.polygonArea(EE.circlePoly(0, 0, 1, 256)), Math.PI, 1e-3);
  ok('circle fit needs 3 points', EE.fitCircle([{ x: 0, y: 0 }, { x: 1, y: 1 }]) === null);
})();

/* ---- station registration ---- */
(function () {
  var th = 0.83, tx = 14.2, ty = -3.9;
  var src = [{ x: 0, y: 0 }, { x: 5, y: 1 }, { x: 2, y: 6 }, { x: -3, y: 4 }];
  var dst = src.map(function (p) {
    return { x: Math.cos(th) * p.x - Math.sin(th) * p.y + tx, y: Math.sin(th) * p.x + Math.cos(th) * p.y + ty };
  });
  var t = EE.rigid2D(src, dst);
  near('rigid2D theta', t.theta, th, 1e-9);
  near('rigid2D tx', t.tx, tx, 1e-9);
  near('rigid2D ty', t.ty, ty, 1e-9);
  near('rigid2D rms on exact data', t.rms, 0, 1e-9);
  near('rigid2D scale diagnostic is 1', t.scale, 1, 1e-9);

  /* A station whose calibration is 8% large must be reported as such. */
  var big = src.map(function (p) { return { x: p.x * 1.08, y: p.y * 1.08 }; });
  var t2 = EE.rigid2D(big, dst);
  near('rigid2D detects an 8% scale error', t2.scale, 1 / 1.08, 1e-9);

  var back = EE.applyRigid(t, src[2]);
  near('applyRigid matches', Math.hypot(back.x - dst[2].x, back.y - dst[2].y), 0, 1e-9);
  ok('rigid2D needs 2 points', EE.rigid2D([{ x: 0, y: 0 }], [{ x: 1, y: 1 }]) === null);
})();

/* ---- similarity fit (camera pose from a reference rectangle) ---- */
(function () {
  var th = -0.41, sc = 1.6, tx = -2.5, ty = 7.25;
  var src = [{ x: 0, y: 0 }, { x: 1.4, y: 0.2 }, { x: 0.9, y: 1.9 }, { x: -0.6, y: 1.1 }];
  var dst = src.map(function (p) {
    return {
      x: sc * (Math.cos(th) * p.x - Math.sin(th) * p.y) + tx,
      y: sc * (Math.sin(th) * p.x + Math.cos(th) * p.y) + ty
    };
  });
  var t = EE.similarity2D(src, dst);
  near('similarity2D scale', t.scale, sc, 1e-9);
  near('similarity2D theta', t.theta, th, 1e-9);
  near('similarity2D tx', t.tx, tx, 1e-9);
  near('similarity2D ty', t.ty, ty, 1e-9);
  near('similarity2D rms on exact data', t.rms, 0, 1e-9);

  /* The regression this function exists for: rigid2D cannot fit a scaled pair,
     and its rms says so. Holding the two apart is the whole point. */
  var rigid = EE.rigid2D(src, dst);
  ok('rigid2D refuses to absorb the 1.6x gap (large rms)', rigid.rms > 0.5, 'rms=' + rigid.rms);
  ok('similarity2D residual is nil where rigid2D fails', t.rms < 1e-9);

  var worst = 0;
  src.forEach(function (p, i) {
    var b = EE.applySimilarityInverse(t, dst[i]);
    worst = Math.max(worst, Math.hypot(b.x - p.x, b.y - p.y));
  });
  near('applySimilarityInverse round trip', worst, 0, 1e-9);
  ok('similarity2D needs 2 points', EE.similarity2D([{ x: 0, y: 0 }], [{ x: 1, y: 1 }]) === null);
})();

/* ---- geodesy ---- */
(function () {
  var anchor = { lat: 43.7615, lon: -79.5083, bearing: 27.5 };   /* Vaughan, ON */
  var worst = 0;
  [[0, 0], [50, 0], [0, 80], [-120, 45], [200, -160]].forEach(function (p) {
    var pt = { x: p[0], y: p[1] };
    var ll = EE.localToLatLon(pt, anchor);
    var back = EE.latLonToLocal(ll, anchor);
    worst = Math.max(worst, Math.hypot(back.x - pt.x, back.y - pt.y));
  });
  near('lat/lon round trip max error (m)', worst, 0, 1e-6);

  /* bearing 0 must put plan +Y due north */
  var n = EE.localToLatLon({ x: 0, y: 100 }, { lat: 43.7615, lon: -79.5083, bearing: 0 });
  ok('bearing 0: +Y goes north', n.lat > 43.7615 && Math.abs(n.lon + 79.5083) < 1e-9);
  var e = EE.localToLatLon({ x: 100, y: 0 }, { lat: 43.7615, lon: -79.5083, bearing: 0 });
  ok('bearing 0: +X goes east', e.lon > -79.5083 && Math.abs(e.lat - 43.7615) < 1e-9);
  near('100 m north is ~100 m', (n.lat - 43.7615) * EE.metresPerDeg(43.7615).lat, 100, 1e-6);
})();

/* ---- lat/lon straight to east/north metres ---- */
(function () {
  var o = { lat: 43.7615, lon: -79.5083 };
  var m = EE.metresPerDeg(o.lat);

  near('the origin maps to zero', Math.hypot(
    EE.latLonToEastNorth(o, o).e, EE.latLonToEastNorth(o, o).n), 0, 1e-12);

  var n100 = EE.latLonToEastNorth({ lat: o.lat + 100 / m.lat, lon: o.lon }, o);
  near('100 m north reads as 100 m north', n100.n, 100, 1e-6);
  near('and no east component', n100.e, 0, 1e-12);

  var e50 = EE.latLonToEastNorth({ lat: o.lat, lon: o.lon + 50 / m.lon }, o);
  near('50 m east reads as 50 m east', e50.e, 50, 1e-6);

  /* Distances must agree with the geodesy used everywhere else. */
  var a = { lat: 43.7615, lon: -79.5083 }, b = { lat: 43.7620, lon: -79.5075 };
  var en = EE.latLonToEastNorth(b, a);
  var viaAnchor = EE.latLonToLocal(b, { lat: a.lat, lon: a.lon, bearing: 0 });
  near('agrees with latLonToLocal at bearing 0 (x)', en.e, viaAnchor.x, 1e-9);
  near('agrees with latLonToLocal at bearing 0 (y)', en.n, viaAnchor.y, 1e-9);
})();

/* ---- homography residual: four points cannot check themselves ---- */
(function () {
  var src = [{x:0,y:0},{x:100,y:0},{x:100,y:80},{x:0,y:80},{x:50,y:40}];
  var dst = [{x:0,y:0},{x:10,y:0},{x:10,y:8},{x:0,y:8},{x:5,y:4}];
  var H = EE.homographyFromQuad(src.slice(0,4), dst.slice(0,4));

  var self = EE.homographyResidual(H, src.slice(0,4), dst.slice(0,4));
  near('the four points it was built from always fit exactly', self.worst, 0, 1e-9);

  var check = EE.homographyResidual(H, src.slice(4), dst.slice(4));
  near('a consistent fifth point also fits', check.worst, 0, 1e-9);
  ok('and it is the first thing that could have disagreed', check.n === 1);

  /* Move the fifth point and the residual must report it. */
  var bad = EE.homographyResidual(H, src.slice(4), [{x:5.4,y:4.3}]);
  near('a displaced check point is measured', bad.worst, Math.hypot(0.4,0.3), 1e-9);

  var multi = EE.homographyResidual(H, src, dst);
  near('rms over all five is nil for exact data', multi.rms, 0, 1e-9);
  ok('null for no points', EE.homographyResidual(H, [], []) === null);
  ok('null without a homography', EE.homographyResidual(null, src, dst) === null);
})();

/* ---- two-point georeference ---- */
(function () {
  var truth = { lat: 43.7615, lon: -79.5083, bearing: 27.5 };
  var pA = { x: 3, y: -2 }, pB = { x: 47, y: 66 };
  var llA = EE.localToLatLon(pA, truth), llB = EE.localToLatLon(pB, truth);

  var fit = EE.anchorFromTwoPoints(pA, llA, pB, llB);
  ok('anchorFromTwoPoints solved', !!fit);
  near('recovered bearing', fit.anchor.bearing, truth.bearing, 1e-6);
  near('recovered scale error is nil', fit.scaleError, 0, 1e-6);

  var checkA = EE.localToLatLon(pA, fit.anchor);
  var checkB = EE.localToLatLon(pB, fit.anchor);
  near('point A lands on its lat', checkA.lat, llA.lat, 1e-9);
  near('point A lands on its lon', checkA.lon, llA.lon, 1e-9);
  near('point B lands on its lat', checkB.lat, llB.lat, 1e-8);
  near('point B lands on its lon', checkB.lon, llB.lon, 1e-8);

  /* A survey 5% too big must be reported, not silently absorbed. */
  var bad = EE.anchorFromTwoPoints(pA, llA, { x: pA.x + (pB.x - pA.x) * 1.05, y: pA.y + (pB.y - pA.y) * 1.05 }, llB);
  near('scaleError reports a 5% oversize', bad.scaleError, 0.05, 1e-6);
})();

/* ---- KML ---- */
(function () {
  var project = {
    name: 'Test roof', address: '121 Pippin Rd',
    anchor: { lat: 43.7615, lon: -79.5083, bearing: 0 },
    objects: [
      { id: 'a', kind: 'rect', name: 'RTU-1', cx: 0, cy: 0, w: 2, l: 3, rot: 0, h: 1.2 },
      { id: 'b', kind: 'cylinder', name: 'Stack', cx: 10, cy: 4, r: 0.4, h: 2.5 },
      { id: 'c', kind: 'outline', name: 'Roof', pts: [{ x: -20, y: -20 }, { x: 20, y: -20 }, { x: 20, y: 20 }, { x: -20, y: 20 }], h: 0 }
    ]
  };
  var kml = EE.buildKML(project, { unit: 'm', nameTemplate: '{name} h={h}{u}', circleSegments: 24 });
  ok('kml produced', !!kml && kml.indexOf('<kml') === 0 === false && kml.indexOf('<kml') > 0);
  /* three geometries plus a floating label for each */
  ok('kml has six placemarks', (kml.match(/<Placemark>/g) || []).length === 6,
     (kml.match(/<Placemark>/g) || []).length);
  ok('kml encodes height in the name', kml.indexOf('RTU-1 h=1.2m') > 0);
  ok('kml carries ExtendedData height', kml.indexOf('<Data name="height_m"><value>1.200</value>') > 0);
  ok('kml extrudes obstructions', kml.indexOf('<extrude>1</extrude>') > 0);
  ok('outline is clamped, not extruded', kml.indexOf('clampToGround') > 0);

  /* Rings, in document order: the outline folder is written first, then the
     obstructions in list order — outline, rect, cylinder.

     Parsed rather than regexed, because label Points carry <coordinates> too and
     a naive match counts them as rings. */
  var kdoc = new DOMParser().parseFromString(kml, 'application/xml');
  ok('kml is well-formed', !kdoc.querySelector('parsererror'));
  var all = Array.prototype.map.call(kdoc.querySelectorAll('LinearRing > coordinates'),
    function (n) { return n.textContent.trim().split(/\s+/); });
  ok('three rings emitted', all.length === 3, 'got ' + all.length);
  ok('ring is closed', all[0][0] === all[0][all[0].length - 1]);

  var outlineNW = all[0][0].split(',');
  ok('coordinate is lon,lat,alt',
    Math.abs(parseFloat(outlineNW[0]) + 79.5083) < 0.01 && Math.abs(parseFloat(outlineNW[1]) - 43.7615) < 0.01);
  near('outline corner sits 20 m west of the anchor', parseFloat(outlineNW[0]),
    -79.5083 + (-20) / EE.metresPerDeg(43.7615).lon, 1e-8);

  var rectSW = all[1][0].split(',');
  near('rect corner sits 1 m west of centre', parseFloat(rectSW[0]),
    -79.5083 + (-1) / EE.metresPerDeg(43.7615).lon, 1e-8);
  near('rect corner carries its 1.2 m height', parseFloat(rectSW[2]), 1.2, 1e-9);

  ok('cylinder ring has 24 segments plus closure', all[2].length === 25, 'got ' + all[2].length);

  ok('kml escapes markup in names', EE.buildKML({
    name: 'x', anchor: project.anchor,
    objects: [{ id: 'z', kind: 'rect', name: 'A & <B>', cx: 0, cy: 0, w: 1, l: 1, rot: 0, h: 1 }]
  }, { unit: 'm', nameTemplate: '{name}' }).indexOf('A &amp; &lt;B&gt;') > 0);

  ok('no anchor -> no kml', EE.buildKML({ name: 'x', objects: [] }, {}) === null);

  /* ---- floating labels ----
     A name painted on the deck is buried by the first thing placed over it, so
     labels hang above their object on a tether instead. */
  var labelFolder = Array.prototype.filter.call(kdoc.querySelectorAll('Folder'), function (f) {
    return f.querySelector('name').textContent === 'Labels';
  })[0];
  ok('a Labels folder exists', !!labelFolder);

  var labels = {};
  Array.prototype.forEach.call(labelFolder.querySelectorAll('Placemark'), function (pm) {
    var c = pm.querySelector('Point > coordinates').textContent.split(',');
    labels[pm.querySelector('name').textContent] = {
      lon: +c[0], lat: +c[1], alt: +c[2],
      mode: pm.querySelector('Point > altitudeMode').textContent,
      tether: pm.querySelector('Point > extrude').textContent
    };
  });
  ok('one label per named object', Object.keys(labels).length === 3, Object.keys(labels).join(' | '));

  var lr = labels['RTU-1 h=1.2m'];
  ok('label carries the formatted name with its height', !!lr, Object.keys(labels).join(' | '));
  near('label floats at object height + default lift', lr.alt, 1.2 + 1.0, 1e-9);
  ok('altitude is relative to ground', lr.mode === 'relativeToGround');
  ok('a tether is drawn down to the deck', lr.tether === '1');
  ok('the taller stack gets a higher label', labels['Stack h=2.5m'].alt > lr.alt,
     labels['Stack h=2.5m'].alt);
  ok('a flat outline still gets a readable lift', labels['Roof'].alt >= 1.0, labels['Roof'].alt);
  ok('the pin icon is suppressed, leaving text and tether', /<IconStyle><scale>0<\/scale>/.test(kml));

  near('label sits over its object centre (lon)', lr.lon, -79.5083, 1e-9);
  near('label sits over its object centre (lat)', lr.lat, 43.7615, 1e-9);

  /* lift is configurable, and can be switched off entirely */
  var lifted = EE.buildKML(project, { unit: 'm', nameTemplate: '{name} h={h}{u}', labelLift: 3.5 });
  var ld = new DOMParser().parseFromString(lifted, 'application/xml');
  var alts = Array.prototype.map.call(ld.querySelectorAll('Point > coordinates'), function (n) {
    return +n.textContent.split(',')[2];
  });
  near('a bigger lift raises every label', Math.min.apply(null, alts), 3.5, 1e-9);

  var bare = EE.buildKML(project, { unit: 'm', nameTemplate: '{name}', labels: false });
  ok('labels can be switched off', bare.indexOf('<Point>') < 0 &&
     (bare.match(/<Placemark>/g) || []).length === 3);

  var ft = EE.fmtName('{name} h={h}{u}', 'RTU', 1.2192, 'ft');
  ok('name template converts to feet', ft === 'RTU h=4ft', ft);
})();

/* ---- unit helpers ---- */
(function () {
  near('toM feet', EE.toM(10, 'ft'), 3.048, 1e-12);
  near('fromM feet', EE.fromM(3.048, 'ft'), 10, 1e-12);
  ok('fmtLen metric', EE.fmtLen(3.456, 'm') === '3.46 m', EE.fmtLen(3.456, 'm'));
  ok('fmtLen imperial', EE.fmtLen(3.048, 'ft') === '10.0 ft', EE.fmtLen(3.048, 'ft'));
})();

document.getElementById('out').innerHTML = lines.join('');
document.getElementById('sum').innerHTML = fail === 0
  ? '<span class="ok">ALL ' + pass + ' CHECKS PASSED</span>'
  : '<span class="bad">' + fail + ' FAILED</span> · ' + pass + ' passed';
document.title = fail === 0 ? 'PASS ' + pass : 'FAIL ' + fail;
</script>
</body>
</html>
