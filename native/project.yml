# Eagle Eye — native shell (XcodeGen spec).
#
# XcodeGen rather than a checked-in .xcodeproj: a pbxproj is a generated
# artefact that no one can review and that merges badly, while this file is
# the whole project in twenty readable lines. On the Mac:
#
#   brew install xcodegen
#   ./sync-web.sh && xcodegen && open EagleEye.xcodeproj
#
# CI does exactly the same two commands on a macOS runner.
#
# Team QNXFKPBTD8, bundle com.midnightcalm.eagleeye. Built in the cloud:
# see .github/workflows/ios.yml — no Mac required.

name: EagleEye
options:
  bundleIdPrefix: com.midnightcalm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: QNXFKPBTD8
    MARKETING_VERSION: "1.29.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  EagleEye:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: www
        type: folder          # copied in whole, unprocessed
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Eagle Eye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground     # Assets.xcassets/LaunchBackground.colorset
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: >-
          Eagle Eye measures roofs from the camera. ARKit needs the camera to
          track where the phone is while you survey.
        NSMotionUsageDescription: >-
          Motion data is what tells Eagle Eye how the phone is tilted, which is
          what turns a photograph into a measurement.
        NSLocationWhenInUseUsageDescription: >-
          A coarse fix places the survey on the map so the export lands in the
          right place. Measurements never depend on it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.midnightcalm.eagleeye
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only, and it MUST live on the target: XcodeGen gives every iOS
        # app target a preset carrying "1,2", which overrides anything set at
        # project level. Declaring iPad support while offering only portrait is
        # ITMS-90474 at validation.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Automatic signing picks the profile TYPE from the identity it is
        # asked for. Left at the default "Apple Development" it hunts for a
        # development profile, which requires registered device UDIDs — and a
        # cloud runner has no device to register. Naming the distribution
        # identity redirects it to an App Store profile, which needs none.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"

schemes:
  EagleEye:
    build:
      targets:
        EagleEye: [run, test, profile, analyze, archive]
    run:
      config: Debug
    archive:
      config: Release
